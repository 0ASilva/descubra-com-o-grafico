<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Descubra com o gráfico</title>
<style>
  :root {
    --papel: #fffdf5;        /* fundo creme */
    --papel2: #f4eeff;       /* fundo de seções */
    --card: #ffffff;
    --tinta: #241436;
    --tinta-fraca: #6b5b7d;
    --roxo: #4b0082;
    --roxo-esc: #3b1163;
    --laranja: #ff6633;
    --borda: #e0d6ee;
    --grade: #e6dff0;
    --eixo: #2b2140;
  }
  * { box-sizing: border-box; }
  html, body { overflow-x: hidden; }
  body {
    margin: 0; background: var(--papel); color: var(--tinta);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .deck { position: relative; height: 100vh; height: 100dvh; overflow: hidden; }
  .track { display: flex; height: 100%; transition: transform .5s ease; }
  .slide { flex: 0 0 100%; height: 100%; overflow-y: auto; padding: 0 16px 24px; -webkit-overflow-scrolling: touch; }
  .wrap { max-width: 480px; margin: 0 auto; }

  /* Cabeçalho roxo, com a logo do IFRJ e os textos do professor */
  .hero {
    background: var(--roxo); color: #ffffff;
    margin: 0 -16px; padding: 14px 18px;
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
  }
  .hero img { height: 84px; width: auto; }
  .teacher { text-align: right; line-height: 1.35; }
  .teacher div:first-child { font-weight: 700; font-size: 1.05rem; }
  .teacher div:last-child { font-size: .95rem; opacity: .9; }

  /* Cartões das seções */
  .card-sec {
    background: var(--card); border: 1px solid var(--borda); border-radius: 14px;
    padding: 16px; margin-top: 16px;
  }
  .card-sec h2 { font-size: 1.05rem; margin: 0 0 8px; color: var(--roxo); display: flex; align-items: center; gap: 8px; }
  .num {
    width: 26px; height: 26px; border-radius: 50%; background: var(--roxo); color: #ffffff;
    display: inline-flex; align-items: center; justify-content: center; font-size: .9rem; flex: 0 0 auto;
  }

  h1 { font-size: 1.35rem; margin: 20px 0 6px; text-align: center; color: var(--roxo); }
  p.lead { color: var(--tinta-fraca); margin: 0 0 12px; text-align: center; }
  .note { color: var(--tinta-fraca); font-size: .92rem; text-align: center; margin: 0; }
  .center { text-align: center; }

  /* Cabeçalho da etapa: título, identificação e instrução */
  .stage-top { text-align: center; padding-top: 16px; }
  .stage-top .titulo { margin: 0; font-size: 1rem; color: var(--tinta-fraca); font-weight: 600; }
  .stage-top .identificacao { margin: 2px 0 0; font-size: 1.6rem; font-weight: 800; color: var(--roxo); }
  .stage-top .instrucao { margin: 4px 0 0; font-weight: 600; min-height: 1.5em; color: var(--laranja); }

  /* Seção intermediária: setas à esquerda, botões à direita */
  .stage-mid {
    display: flex; justify-content: space-between; align-items: center;
    gap: 8px; flex-wrap: wrap; margin: 12px 0;
  }
  .setas { display: flex; gap: 6px; }
  .botoes { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; flex: 1 1 auto; }

  .icon {
    width: 44px; height: 44px; padding: 0; border-radius: 50%; display: inline-flex;
    align-items: center; justify-content: center; cursor: pointer;
    border: 1.5px solid var(--roxo); background: var(--card); color: var(--roxo);
  }
  .icon svg { width: 22px; height: 22px; }
  .icon[hidden] { display: none; }

  button {
    font: inherit; padding: 10px 14px; min-height: 44px; border-radius: 12px; cursor: pointer;
    border: 1.5px solid var(--borda); background: var(--card); color: var(--roxo);
  }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--roxo); border-color: var(--roxo); color: #ffffff; font-weight: 700; }
  button[aria-pressed="true"] { background: var(--roxo); border-color: var(--roxo); color: #ffffff; }

  /* Seção de base: navegação de gráficos e gráfico */
  .stage-base { margin-top: 4px; }
  .graph-nav { display: flex; align-items: center; gap: 12px; justify-content: center; margin-bottom: 8px; }
  .graph-nav h2 { font-size: 1.1rem; margin: 0; color: var(--tinta); }
  .stage-base canvas {
    display: block; width: 100%; max-width: 420px; height: auto; margin: 0 auto;
    background: var(--card); border: 1px solid var(--borda); border-radius: 14px; cursor: pointer;
  }

  .avatars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; max-width: 360px; margin: 14px auto; }
  .avatar { font-size: 2rem; padding: 8px; min-height: 0; border-radius: 12px; border: 2px solid var(--borda); background: var(--card); cursor: pointer; }
  .avatar[aria-pressed="true"] { border-color: var(--roxo); background: var(--papel2); }
  .name-label { display: block; max-width: 360px; margin: 8px auto 6px; font-weight: 700; text-align: left; color: var(--roxo); }
  .name-input {
    display: block; width: 100%; max-width: 360px; margin: 0 auto; font: inherit; padding: 10px;
    border-radius: 12px; border: 1.5px solid var(--borda); background: var(--card); color: var(--tinta);
  }
  .actions { display: flex; justify-content: space-between; gap: 8px; margin-top: 18px; }
</style>
</head>
<body>
<div class="deck">
  <div class="track" id="track">

    <!-- Slide 0: início (identificação) -->
    <section class="slide">
      <header class="hero">
        <img src="ifrj_logo_branca.png" alt="Logo do IFRJ Campus Nilópolis">
        <div class="teacher">
          <div>Matemática</div>
          <div>Prof. André Silva</div>
        </div>
      </header>
      <div class="wrap">
        <div class="card-sec center">
          <h1>Descubra com o gráfico</h1>
          <label class="name-label" for="studentName">Nome do estudante</label>
          <input class="name-input" type="text" id="studentName" autocomplete="name" placeholder="Digite seu nome">
          <p class="lead" style="margin-top:16px">Escolha um avatar para começar.</p>
          <div class="avatars" id="avatars"></div>
          <p class="note" id="avatarMsg">Digite seu nome e escolha um avatar para continuar.</p>
          <div class="actions" style="justify-content:center">
            <button class="primary" id="startBtn" data-next disabled>Começar</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Slide 1: instruções (a detalhar ao final) -->
    <section class="slide">
      <header class="hero">
        <img src="ifrj_logo_branca.png" alt="Logo do IFRJ Campus Nilópolis">
        <div class="teacher">
          <div>Matemática</div>
          <div>Prof. André Silva</div>
        </div>
      </header>
      <div class="wrap">
        <div class="card-sec">
          <h2><span class="num">i</span> Instruções</h2>
          <p class="note" style="text-align:left">Esta página será detalhada ao final do projeto.</p>
        </div>
        <div class="actions">
          <button data-prev>← Voltar</button>
          <button class="primary" data-go="2">Começar →</button>
        </div>
      </div>
    </section>

    <!-- Slides 2 a 5: etapas da atividade são criadas pelo script -->

  </div>
</div>

<script>
(() => {
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const CURVE = '#975FA8';   // cor dos gráficos (destaques e âncoras)
  const SEG = '#E07415';     // cor dos intervalos no eixo x
  const PI = Math.PI;
  const WIN = { x0: -6, x1: 6, y0: -6, y1: 6 };
  const N = 1200;
  const DUR = 1500;          // duração da animação de cada propriedade, em ms
  const AVATARS = ['🦊','🐼','🐸','🦉','🐙','🦄','🐯','🐨','🐵','🦖','🐧','🐢','🦋','🐝','🐬','🦁'];

  // Funções da atividade. Cada uma pode ter janela própria (win), grade (grid),
  // extremidades finitas (finiteEdges) e rótulos do fim acima do eixo (labelsAbove).
  const FUNCS = [
    { f: x => x * x - 4 },
    { f: x => x ** 3 / 4 - 3 * x },
    { f: x => 3 * Math.sin(x),
      win: { x0: -2 * PI, x1: 2 * PI }, finiteEdges: true, labelsAbove: true,
      grid: [-2 * PI, -1.5 * PI, -PI, -PI / 2, 0, PI / 2, PI, 1.5 * PI, 2 * PI] },
    { f: x => -((x - 1) ** 2) + 3 },
    { f: x => Math.sqrt(x + 5) - 2 },
    { f: x => Math.abs(x + 2) - 1 }
  ];

  // Etapas e botões de cada etapa
  const ETAPAS = [
    { nome: 'Sinais', botoes: ['positiva', 'negativa'] },
    { nome: 'Extremos', botoes: ['maximo', 'minimo'] },
    { nome: 'Crescimento', botoes: ['crescente', 'decrescente'] },
    { nome: 'Raízes', botoes: ['raizes', 'intercepto'] }
  ];
  const LABELS = {
    positiva: 'Positiva', negativa: 'Negativa', maximo: 'Máximo', minimo: 'Mínimo',
    crescente: 'Crescente', decrescente: 'Decrescente', raizes: 'Raízes', intercepto: 'Intercepto em Y'
  };
  const COLORS_ORDER = ['positiva', 'negativa', 'crescente', 'decrescente', 'maximo', 'minimo', 'raizes', 'intercepto'];
  const INTERVALOS = ['positiva', 'negativa', 'crescente', 'decrescente'];

  const ICON_PREV = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const ICON_NEXT = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  const fmt = v => (Math.abs(v) < 1e-9 ? 0 : Number(v)).toLocaleString('pt-BR', { maximumFractionDigits: 2 });
  const ease = t => 1 - Math.pow(1 - Math.max(0, Math.min(1, t)), 3);

  // ---------- geometria e desenho ----------
  function mapper(c, fn) {
    const w = (fn && fn.win) || WIN;
    return {
      X: x => (x - w.x0) / (w.x1 - w.x0) * c.width,
      Y: y => c.height - (y - WIN.y0) / (WIN.y1 - WIN.y0) * c.height
    };
  }

  function drawAxes(ctx, c, M, fn) {
    const xt = (fn && fn.grid) || [-6, -4, -2, 0, 2, 4, 6];
    ctx.clearRect(0, 0, c.width, c.height);
    ctx.strokeStyle = css('--grade'); ctx.lineWidth = 1;
    for (const v of xt) { ctx.beginPath(); ctx.moveTo(M.X(v), 0); ctx.lineTo(M.X(v), c.height); ctx.stroke(); }
    for (let v = -6; v <= 6; v += 2) { ctx.beginPath(); ctx.moveTo(0, M.Y(v)); ctx.lineTo(c.width, M.Y(v)); ctx.stroke(); }
    ctx.strokeStyle = css('--eixo'); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, M.Y(0)); ctx.lineTo(c.width, M.Y(0));
    ctx.moveTo(M.X(0), 0); ctx.lineTo(M.X(0), c.height); ctx.stroke();
  }

  function strokePath(ctx, xs, ys, M, flags) {
    ctx.beginPath();
    let pen = false;
    for (let i = 0; i < xs.length; i++) {
      if ((flags && !flags[i]) || !Number.isFinite(ys[i])) { pen = false; continue; }
      const X = M.X(xs[i]), Y = M.Y(ys[i]);
      if (!pen) { ctx.moveTo(X, Y); pen = true; } else ctx.lineTo(X, Y);
    }
    ctx.stroke();
  }

  function dot(ctx, x, y, r, col) {
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }

  // Escreve um número com fundo da cor do cartão, para que ele não se misture à curva
  function numLabel(ctx, c, txt, x, y, align) {
    const w = ctx.measureText(txt).width;
    let left = align === 'right' ? x - w : align === 'left' ? x : x - w / 2;
    left = Math.max(2, Math.min(c.width - w - 2, left));
    ctx.fillStyle = css('--card');
    ctx.fillRect(left - 3, y - 14, w + 6, 18);
    ctx.fillStyle = css('--tinta');
    ctx.textAlign = 'left';
    ctx.fillText(txt, left, y);
  }

  // ---------- análise numérica da função ----------
  const d1 = (f, x) => (f(x + 1e-5) - f(x - 1e-5)) / 2e-5;
  const PRED = {
    positiva: (f, x) => f(x) > 0,
    negativa: (f, x) => f(x) < 0,
    crescente: (f, x) => d1(f, x) > 0,
    decrescente: (f, x) => d1(f, x) < 0
  };

  // Encontra a fronteira entre dois pontos onde g muda de valor
  function bisect(lo, hi, g) {
    const gl = g(lo);
    for (let k = 0; k < 60; k++) {
      const m = (lo + hi) / 2;
      if (g(m) === gl) lo = m; else hi = m;
    }
    return (lo + hi) / 2;
  }

  function analyze(fn) {
    if (fn.A) return fn.A;
    const w = fn.win || WIN;
    const L = w.x0, R = w.x1, step = (R - L) / N;
    const xs = [], ys = [];
    for (let i = 0; i <= N; i++) { const x = L + i * step; xs.push(x); ys.push(fn.f(x)); }

    const flags = {}, intervals = {};
    for (const p of INTERVALOS) {
      const g = x => PRED[p](fn.f, x);
      const ok = xs.map(g);
      flags[p] = ok;
      const ivs = [];
      let start = null;
      for (let i = 0; i <= N; i++) {
        if (ok[i] && start === null) start = i;
        if ((!ok[i] || i === N) && start !== null) {
          const endI = ok[i] ? i : i - 1;
          const aInf = start === 0 && !fn.finiteEdges;
          const bInf = endI === N && !fn.finiteEdges;
          const a = start === 0 ? L : bisect(xs[start - 1], xs[start], g);
          const b = endI === N ? R : bisect(xs[endI], xs[endI + 1], g);
          ivs.push({ a, b, aInf, bInf });
          start = null;
        }
      }
      intervals[p] = ivs;
    }

    // Máximos e mínimos: troca de sinal da derivada
    const extrema = [];
    const gp = x => d1(fn.f, x) > 0;
    for (let i = 0; i < N; i++) {
      const a = gp(xs[i]), b = gp(xs[i + 1]);
      if (a !== b) {
        const x0 = bisect(xs[i], xs[i + 1], gp);
        const y0 = fn.f(x0);
        if (Number.isFinite(y0)) extrema.push({ x: x0, y: y0, tipo: a ? 'maximo' : 'minimo' });
      }
    }

    // Raízes: pontos em que a função troca de sinal (ou é zero)
    const roots = [];
    for (let i = 0; i <= N; i++) {
      const y = ys[i];
      if (!Number.isFinite(y)) continue;
      if (y === 0) { roots.push(xs[i]); continue; }
      if (i < N && Number.isFinite(ys[i + 1]) && ys[i + 1] !== 0 && (y > 0) !== (ys[i + 1] > 0)) {
        roots.push(bisect(xs[i], xs[i + 1], x => fn.f(x) > 0));
      }
    }
    const uniqueRoots = roots.filter((r, k) => k === 0 || Math.abs(r - roots[k - 1]) > 1e-6);

    fn.A = { xs, ys, flags, intervals, extrema, roots: uniqueRoots };
    return fn.A;
  }

  // Animação de intervalos (crescente, decrescente, positiva, negativa)
  // Fases: 0 a 0.6 = âncoras descem até o eixo x; 0.6 a 1 = valores e segmento aparecem
  function drawIntervals(ctx, c, M, fn, p, A, prog) {
    const col = CURVE;
    const pa = ease(prog / 0.6), pl = ease((prog - 0.6) / 0.4), y0 = M.Y(0);
    // no gráfico 3, o fim do intervalo fica acima do eixo e o início, abaixo
    const lyEnd = fn.labelsAbove ? y0 - 10 : y0 + 18;
    for (const iv of A.intervals[p]) {
      // segmento e valores primeiro, para que as âncoras fiquem por cima
      if (pl > 0) {
        const xa = M.X(iv.a), xb = M.X(iv.b);
        ctx.strokeStyle = SEG; ctx.lineWidth = 8; ctx.globalAlpha = .9;
        ctx.beginPath(); ctx.moveTo(xa, y0); ctx.lineTo(xa + (xb - xa) * pl, y0); ctx.stroke();
        ctx.globalAlpha = pl;
        ctx.font = 'bold 15px system-ui';
        // infinito fica acima do eixo; números afastam-se do segmento
        if (iv.aInf) numLabel(ctx, c, '−∞', xa, y0 - 10, 'center');
        else numLabel(ctx, c, fmt(iv.a), xa - 6, y0 + 18, 'right');
        if (iv.bInf) numLabel(ctx, c, '+∞', xb, y0 - 10, 'center');
        else numLabel(ctx, c, fmt(iv.b), xb + 6, lyEnd, 'left');
        ctx.globalAlpha = 1;
      }
      for (const e of [{ x: iv.a, inf: iv.aInf }, { x: iv.b, inf: iv.bInf }]) {
        if (e.inf || !Number.isFinite(fn.f(e.x))) continue;
        const px = M.X(e.x), py = M.Y(fn.f(e.x));
        const cy = py + (y0 - py) * pa;
        // a linha tracejada liga o ponto da curva à âncora, que permanece no eixo ao final
        ctx.setLineDash([4, 4]); ctx.strokeStyle = col; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px, cy); ctx.stroke();
        ctx.setLineDash([]);
        dot(ctx, px, cy, 6, col);
      }
    }
  }

  // Animação de máximos e mínimos: só a âncora no eixo y e o valor de y
  function drawExtrema(ctx, c, M, p, A, prog) {
    const col = CURVE;
    const pa = ease(prog / 0.6), pl = ease((prog - 0.6) / 0.4);
    for (const e of A.extrema) {
      if (e.tipo !== p) continue;
      const px = M.X(e.x), py = M.Y(e.y);
      const sx = M.X(0), sy = py;   // âncora apenas no eixo y, na altura do ponto
      const vx = px + (sx - px) * pa, vy = py + (sy - py) * pa;
      ctx.setLineDash([4, 4]); ctx.strokeStyle = col; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(vx, vy); ctx.stroke();
      ctx.setLineDash([]);
      dot(ctx, vx, vy, 5, col);
      dot(ctx, px, py, 6, col);
      if (pl > 0) {
        ctx.globalAlpha = pl;
        ctx.font = 'bold 15px system-ui';
        numLabel(ctx, c, fmt(e.y), sx + 6, py - 6, 'left');
        ctx.globalAlpha = 1;
      }
    }
  }

  // Raízes: valor de x de cada ponto, abaixo do eixo, do lado em que a curva não passa
  function drawRoots(ctx, c, M, fn, A, prog) {
    const pl = ease(prog);
    if (pl <= 0) return;
    const y0 = M.Y(0);
    ctx.globalAlpha = pl;
    ctx.font = 'bold 15px system-ui';
    for (const r of A.roots) {
      const right = fn.f(r + 1e-4) > 0;
      numLabel(ctx, c, fmt(r), right ? M.X(r) + 6 : M.X(r) - 6, y0 + 18, right ? 'left' : 'right');
    }
    ctx.globalAlpha = 1;
  }

  // Intercepto em Y: valor de y do ponto, do lado oposto à curva
  function drawIntercept(ctx, c, M, fn, prog) {
    const pl = ease(prog);
    const y = fn.f(0);
    if (pl <= 0 || !Number.isFinite(y)) return;
    const sx = M.X(0), py = M.Y(y);
    const slope = d1(fn.f, 0);
    ctx.globalAlpha = pl;
    ctx.font = 'bold 15px system-ui';
    if (Math.abs(slope) < 1e-6) {
      // ponto de máximo ou mínimo: o rótulo vai para o lado vazio
      const curv = fn.f(1e-3) + fn.f(-1e-3) - 2 * y;
      if (curv > 0) numLabel(ctx, c, fmt(y), sx, py + 18, 'center');
      else numLabel(ctx, c, fmt(y), sx, py - 12, 'center');
    } else if (slope > 0) {
      numLabel(ctx, c, fmt(y), sx - 8, py - 10, 'right');
    } else {
      numLabel(ctx, c, fmt(y), sx + 8, py - 10, 'left');
    }
    ctx.globalAlpha = 1;
  }

  // Desenha a etapa com os destaques estáticos e as animações já feitas ou em andamento
  function drawGraph(st) {
    const fn = FUNCS[st.gi], state = st.states[st.gi];
    const c = st.canvas, ctx = c.getContext('2d'), M = mapper(c, fn), A = analyze(fn);
    drawAxes(ctx, c, M, fn);
    ctx.lineWidth = 2; ctx.strokeStyle = css('--tinta-fraca'); ctx.globalAlpha = .6;
    strokePath(ctx, A.xs, A.ys, M, null);
    ctx.globalAlpha = 1;

    for (const p of COLORS_ORDER) {
      if (!st.active.has(p)) continue;
      if (INTERVALOS.includes(p)) {
        ctx.lineWidth = 6; ctx.strokeStyle = CURVE;
        strokePath(ctx, A.xs, A.ys, M, A.flags[p]);
      } else if (p === 'maximo' || p === 'minimo') {
        for (const e of A.extrema) if (e.tipo === p) dot(ctx, M.X(e.x), M.Y(e.y), 6, CURVE);
      } else if (p === 'raizes') {
        for (const r of A.roots) dot(ctx, M.X(r), M.Y(0), 6, CURVE);
      } else if (p === 'intercepto') {
        const y = fn.f(0);
        if (Number.isFinite(y)) dot(ctx, M.X(0), M.Y(y), 6, CURVE);
      }
    }

    for (const p of COLORS_ORDER) {
      if (!st.active.has(p)) continue;
      let prog = null;
      if (state.current && state.current.prop === p) prog = state.current.p;
      else if (state.done.has(p)) prog = 1;
      if (prog === null) continue;
      if (INTERVALOS.includes(p)) drawIntervals(ctx, c, M, fn, p, A, prog);
      else if (p === 'raizes') drawRoots(ctx, c, M, fn, A, prog);
      else if (p === 'intercepto') drawIntercept(ctx, c, M, fn, prog);
      else drawExtrema(ctx, c, M, p, A, prog);
    }
  }

  // Anima as propriedades ativas, uma após a outra, no gráfico atual da etapa
  function playGraph(st) {
    const state = st.states[st.gi];
    if (state.running) return;
    const queue = COLORS_ORDER.filter(p => st.active.has(p));
    if (!queue.length) return;
    state.running = true; state.done = new Set();
    const token = ++state.token; // invalida animações antigas quando o botão muda
    let i = 0;
    const next = () => {
      if (token !== state.token) return;
      if (i >= queue.length) { state.running = false; state.current = null; drawGraph(st); return; }
      const prop = queue[i++];
      const t0 = performance.now();
      const frame = now => {
        if (token !== state.token) return;
        const p = Math.min(1, (now - t0) / DUR);
        state.current = { prop, p };
        drawGraph(st);
        if (p < 1) requestAnimationFrame(frame);
        else { state.done.add(prop); state.current = null; next(); }
      };
      requestAnimationFrame(frame);
    };
    next();
  }

  // Volta os gráficos da etapa ao aspecto inicial, cancelando animações em andamento
  function resetStage(st) {
    st.states.forEach(s => { s.token++; s.running = false; s.done = new Set(); s.current = null; });
    drawGraph(st);
  }

  // ---------- navegação entre telas ----------
  const track = document.getElementById('track');
  let current = 0;
  function go(i) {
    current = Math.max(0, Math.min(track.children.length - 1, i));
    track.style.transform = `translateX(-${current * 100}%)`;
    track.children[current].scrollTop = 0;
  }
  document.querySelectorAll('[data-next]').forEach(b => b.onclick = () => go(current + 1));
  document.querySelectorAll('[data-prev]').forEach(b => b.onclick = () => go(current - 1));
  document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(Number(b.dataset.go)));

  // ---------- início: nome e avatar ----------
  let avatar = null;
  let studentName = '';
  const avBox = document.getElementById('avatars');
  const startBtn = document.getElementById('startBtn');
  const nameInput = document.getElementById('studentName');
  const avatarMsg = document.getElementById('avatarMsg');

  function updateStart() {
    startBtn.disabled = !(avatar && studentName);
    if (!studentName) avatarMsg.textContent = 'Digite seu nome e escolha um avatar para continuar.';
    else if (!avatar) avatarMsg.textContent = 'Escolha um avatar para continuar.';
    else avatarMsg.textContent = 'Pronto! Clique em Começar.';
  }

  nameInput.addEventListener('input', () => {
    studentName = nameInput.value.trim();
    updateStart();
  });

  AVATARS.forEach(emoji => {
    const b = document.createElement('button');
    b.className = 'avatar'; b.textContent = emoji; b.setAttribute('aria-pressed', 'false');
    b.onclick = () => {
      avatar = emoji;
      avBox.querySelectorAll('.avatar').forEach(x => x.setAttribute('aria-pressed', 'false'));
      b.setAttribute('aria-pressed', 'true');
      updateStart();
    };
    avBox.appendChild(b);
  });
  updateStart();

  // ---------- etapas da atividade (uma tela por etapa) ----------
  ETAPAS.forEach((et, s) => {
    const sec = document.createElement('section');
    sec.className = 'slide';
    sec.innerHTML = `
      <div class="wrap">
        <header class="stage-top">
          <p class="titulo">Descubra com o gráfico</p>
          <p class="identificacao">${et.nome}</p>
          <p class="instrucao" hidden>Clique em cada gráfico.</p>
        </header>
        <div class="stage-mid">
          <div class="setas">
            <button class="icon" data-stage-prev aria-label="Etapa anterior">${ICON_PREV}</button>
            <button class="icon" data-stage-next aria-label="Próxima etapa">${ICON_NEXT}</button>
          </div>
          <div class="botoes"></div>
        </div>
        <div class="stage-base">
          <div class="graph-nav">
            <div class="setas">
              <button class="icon" data-graph-prev aria-label="Gráfico anterior">${ICON_PREV}</button>
              <button class="icon" data-graph-next aria-label="Próximo gráfico">${ICON_NEXT}</button>
            </div>
            <h2 class="graph-name">Gráfico 1</h2>
          </div>
          <canvas width="360" height="360" aria-label="Gráfico da função"></canvas>
        </div>
      </div>`;
    track.appendChild(sec);

    const st = {
      s, canvas: sec.querySelector('canvas'), hint: sec.querySelector('.instrucao'),
      graphName: sec.querySelector('.graph-name'), gi: 0, active: new Set(),
      states: FUNCS.map(() => ({ done: new Set(), current: null, running: false, token: 0 }))
    };

    // setas de etapa: a da esquerda some na primeira etapa; a da direita some na última
    const prevBtn = sec.querySelector('[data-stage-prev]');
    const nextBtn = sec.querySelector('[data-stage-next]');
    prevBtn.hidden = s === 0;
    nextBtn.hidden = s === ETAPAS.length - 1;
    prevBtn.onclick = () => go(2 + s - 1);
    nextBtn.onclick = () => go(2 + s + 1);

    // botões da etapa: apenas um fica ativo por vez
    const box = sec.querySelector('.botoes');
    et.botoes.forEach(key => {
      const b = document.createElement('button');
      b.textContent = LABELS[key]; b.setAttribute('aria-pressed', 'false');
      b.onclick = () => {
        const wasOn = st.active.has(key);
        st.active.clear();
        box.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', 'false'));
        if (!wasOn) { st.active.add(key); b.setAttribute('aria-pressed', 'true'); }
        st.hint.hidden = st.active.size === 0;
        resetStage(st);
      };
      box.appendChild(b);
    });

    // navegação entre gráficos: circular (1 volta ao 6 e o 6 avança ao 1)
    const showGraph = () => {
      st.graphName.textContent = `Gráfico ${st.gi + 1}`;
      drawGraph(st);
    };
    sec.querySelector('[data-graph-prev]').onclick = () => {
      st.gi = (st.gi + FUNCS.length - 1) % FUNCS.length; showGraph();
    };
    sec.querySelector('[data-graph-next]').onclick = () => {
      st.gi = (st.gi + 1) % FUNCS.length; showGraph();
    };

    st.canvas.addEventListener('click', () => {
      if (st.active.size) playGraph(st);
    });

    drawGraph(st);
  });
})();
</script>
</body>
</html>

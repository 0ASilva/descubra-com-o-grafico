    .b3-tab { margin: 0 auto 8px; border-collapse: collapse; }
    .b3-tab th, .b3-tab td { border: 1px solid var(--borda); padding: 4px 12px; text-align: center; }
    .b3-tab .resp { width: 64px; }
    .b3-resp .resp { width: 64px; font: inherit; padding: 4px; text-align: center; border: 1.5px solid var(--roxo); border-radius: 8px; background: #fff; color: var(--tinta); }
    .b3-teclas[hidden] { display: none; }
    .b3-trava { position: fixed; inset: 0; z-index: 40; background: transparent; }
    .b3-trava[hidden] { display: none; }
  `;
  document.head.appendChild(eCss);

  // Respostas corretas e caixas de cada gráfico. Na segunda função, a coordenada escondida de
  // cada ponto é sorteada a cada acesso (0 = esconde x, 1 = esconde y).
  function eRegistros(gi) {
    const caixa = (k, v) => `<input class="resp" data-k="${k}" data-v="${v}" inputmode="none" autocomplete="off" aria-label="resposta">`;
    if (gi === 0) {
      // uma linha por valor de x: tabela (x | f(x)), notação e pontos ocupam o mesmo registro
      return {
        html: `
          <table class="b3-tab3">
            <tr><th colspan="2">Tabela</th><th>Notação</th><th>Pontos</th></tr>
            <tr><th>x</th><th>f(x)</th><th></th><th></th></tr>
            <tr><td>-2</td><td>${caixa('t1', 4)}</td>
                <td>f(-2) = ${caixa('n1', 4)}</td>
                <td>(${caixa('p1x', -2)}, ${caixa('p1y', 4)})</td></tr>
            <tr><td>${caixa('t2x', 0)}</td><td>${caixa('t2y', 0)}</td>
                <td>${caixa('n2', 0)} = f(0)</td>
                <td>(${caixa('p2x', 0)}, ${caixa('p2y', 0)})</td></tr>
            <tr><td>${caixa('t3x', 1)}</td><td>${caixa('t3y', 1)}</td>
                <td>f(1) = ${caixa('n3', 1)}</td>
                <td>(${caixa('p3x', 1)}, ${caixa('p3y', 1)})</td></tr>
          </table>`
      };
    }
    // segundo gráfico: uma linha por ponto. Em cada linha, a situação é sorteada a cada acesso:
    // 0 = só x aparece; 1 = só y aparece; 2 = nenhum aparece (x e y para preencher)
    const linhas = eG[1].pontos.map(([x, y], i) => {
      const sit = Math.floor(Math.random() * 3);
      const tx = sit === 0 ? String(x) : caixa(`q${i}x`, x);
      const ty = sit === 1 ? String(y) : caixa(`q${i}y`, y);
      return `<tr><td>${tx}</td><td>${ty}</td>
              <td>f(${x}) = ${caixa(`n${i}`, y)}</td>
              <td>(${caixa(`p${i}x`, x)}, ${caixa(`p${i}y`, y)})</td></tr>`;
    }).join('');
    return {
      html: `
        <table class="b3-tab3">
          <tr><th colspan="2">Tabela</th><th>Notação</th><th>Pontos</th></tr>
          <tr><th>x</th><th>f(x)</th><th></th><th></th></tr>
          ${linhas}
        </table>`
    };
  }

  // Raízes de f(x) = v no domínio, a mais próxima de xref
  function eRaiz(f, v, dom, xref) {
    const N = 800, L = dom[0], R = dom[1], h = (R - L) / N;
    let best = null, bd = Infinity, xa = L, ya = f(L) - v;
    for (let i = 1; i <= N; i++) {
      const xb = L + i * h, yb = f(xb) - v;
      if (Number.isFinite(ya) && Number.isFinite(yb) && (ya > 0) !== (yb > 0)) {
        let lo = xa, hi = xb;
        for (let k = 0; k < 50; k++) {
          const m = (lo + hi) / 2;
          if ((f(m) - v > 0) === (f(lo) - v > 0)) lo = m; else hi = m;
        }
        const r = (lo + hi) / 2, d = Math.abs(r - xref);
        if (d < bd) { bd = d; best = r; }
      }
      xa = xb; ya = yb;
    }
    return best;
  }

  // Todas as interseções com os eixos dentro do domínio, em ordem de x
  function eInterceptos(gi) {
    const { f, dom } = eG[gi];
    const N = 800, h = (dom[1] - dom[0]) / N, ev = [];
    let xa = dom[0], ya = f(dom[0]);
    for (let i = 0; i <= N; i++) {
      const x = dom[0] + i * h, y = f(x);
      if (Math.abs(y) < 1e-9) ev.push({ x: Math.abs(x) < 1e-9 ? 0 : x, y: 0 });
      else if (i > 0 && Number.isFinite(ya) && Number.isFinite(y) && (ya > 0) !== (y > 0)) {
        const r = eRaiz(f, 0, dom, x);
        if (r !== null) ev.push({ x: r, y: 0 });
      }
      xa = x; ya = y;
    }
    if (dom[0] <= 0 && dom[1] >= 0) ev.push({ x: 0, y: f(0) });
    // remove repetidos e ordena pela abscissa
    const uniq = [];
    ev.sort((a, b) => a.x - b.x).forEach(p => {
      if (!uniq.some(q => Math.abs(q.x - p.x) < 1e-6 && Math.abs(q.y - p.y) < 1e-6)) uniq.push({ x: Math.round(p.x * 1e6) / 1e6, y: Math.round(p.y * 1e6) / 1e6 });
    });
    return uniq;
  }

  // Desenho base: grade, eixos, curva, extremidades, pontos da lista e as cruzes com G
  function eBase(ctx, gi, xA) {
    const { f, dom, pontos } = eG[gi];
    ctx.clearRect(0, 0, E_W, E_H);
    ctx.strokeStyle = css('--grade'); ctx.lineWidth = 1;
    for (let v = -5; v <= 5; v++) {
      ctx.beginPath(); ctx.moveTo(eX(v), 0); ctx.lineTo(eX(v), E_H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, eY(v)); ctx.lineTo(E_W, eY(v)); ctx.stroke();
    }
    ctx.strokeStyle = css('--eixo'); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, eY(0)); ctx.lineTo(E_W, eY(0)); ctx.moveTo(eX(0), 0); ctx.lineTo(eX(0), E_H); ctx.stroke();

    // curva no domínio
    ctx.strokeStyle = CURVE; ctx.lineWidth = 3; ctx.beginPath();
    for (let i = 0; i <= 200; i++) {
      const x = dom[0] + i * (dom[1] - dom[0]) / 200;
      if (i === 0) ctx.moveTo(eX(x), eY(f(x))); else ctx.lineTo(eX(x), eY(f(x)));
    }
    ctx.stroke();
    // extremidades cheias (o gráfico inclui os dois extremos)
    ePonto(ctx, eX(dom[0]), eY(f(dom[0])), 6, CURVE);
    ePonto(ctx, eX(dom[1]), eY(f(dom[1])), 6, CURVE);
    // pontos da lista (segunda função)
    if (pontos) pontos.forEach(([x, y]) => ePonto(ctx, eX(x), eY(y), 5, '#ffffff'));
    // destaques roxos: só os já alcançados pela cruz
    (eG[gi].especiais || []).forEach(px => {
      if (!eEst[gi].alc.has(px)) return;
      ePonto(ctx, eX(px), eY(f(px)), 7, CURVE);
    });

    // âncoras e cruzes: A no eixo x, G na curva, C no eixo y
    const yG = f(xA), ax = eX(xA), ay = eY(0), gx = eX(xA), gy = eY(yG), cx = eX(0), cy = eY(yG);
    ctx.setLineDash([4, 4]); ctx.strokeStyle = CURVE; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(gx, gy); ctx.lineTo(cx, cy); ctx.stroke();
    ctx.setLineDash([]);
    cruz(ctx, ax, ay);
    cruz(ctx, cx, cy);
    ePonto(ctx, gx, gy, 6, CURVE);
    // valores das coordenadas presos às cruzes: x sob a cruz do eixo x, y ao lado da cruz do eixo y
    eCaixa(ctx, fmt(xA), ax - 10, ay + 24, null, 1);
    eCaixa(ctx, fmt(yG), cx + 10, cy - 8, null, 1);
  }

  // Caixa de texto opaca, para que o rótulo fique por cima do gráfico sem deixá-lo aparecer
  function eCaixa(ctx, txt, x, y, cor, alfa) {
    ctx.save();
    ctx.globalAlpha = alfa;
    ctx.font = 'bold 15px system-ui';
    const w = ctx.measureText(txt).width;
    ctx.fillStyle = css('--fundo-grafico');
    ctx.fillRect(x - 4, y - 15, w + 8, 20);
    ctx.fillStyle = cor || css('--tinta');
    ctx.textAlign = 'left';
    ctx.fillText(txt, x, y);
    ctx.restore();
  }

  // Ajuda "Valor da função": o ponto vai a x escolhido, e o valor sai pelos eixos até G
  function eValor(ctx, gi, st, t) {
    const { f } = eG[gi];
    const xE = st.ajuda.xE, yG = f(xE);
    let xA = st.x;
    if (t < 1000) xA = st.x + (xE - st.x) * ease(t / 1000);
    else xA = xE;
    eBase(ctx, gi, xA);
    const trem = (x1, y1, x2, y2) => {
      ctx.strokeStyle = SEG; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x1, y1);
      for (let k = 1; k <= 8; k++) {
        const u = k / 8, jit = k < 8 ? (Math.random() * 8 - 4) : 0;
        ctx.lineTo(x1 + (x2 - x1) * u + jit, y1 + (y2 - y1) * u - jit);
      }
      ctx.stroke();
    };
    const ax = eX(xE), ay = eY(0), gx = eX(xE), gy = eY(yG), cx = eX(0);
    if (t >= 1000 && t < 2000) {
      const piscar = (Math.sin((t - 1000) / 110) + 1) / 2;
      eCaixa(ctx, fmt(xE), ax - 8, ay + 22, null, piscar);
    }
    if (t >= 2000 && t < 3000) trem(ax, ay, gx, gy);
    if (t >= 3000 && t < 4000) {
      trem(gx, gy, cx, gy);
      const piscar = (Math.sin((t - 3000) / 110) + 1) / 2;
      eCaixa(ctx, fmt(yG), cx + 8, gy - 6, null, piscar);
    }
    if (t >= 4000) {
      const a = t < 5200 ? 1 : Math.max(0, 1 - (t - 5200) / 1300);
      eCaixa(ctx, `${fmt(yG)} = f(${fmt(xE)})`, 10, 24, null, a);
      eCaixa(ctx, `(${fmt(xE)}, ${fmt(yG)})`, gx + 10, gy - 14, null, a);
    }
  }

  // Ajuda "Interceptos": um ponto viaja pela curva; cada interseção vibra e mostra as coordenadas
  function eInter(ctx, gi, st, t) {
    const { f, dom } = eG[gi];
    const ev = st.ajuda.eventos, TRAJ = 2600, VIB = 1500, RT = 600;
    const fim = ev[ev.length - 1].x;
    const tEv = ev.map(e => (e.x - dom[0]) / (fim - dom[0]) * TRAJ);
    const xT = dom[0] + (fim - dom[0]) * Math.min(1, t / TRAJ);
    eBase(ctx, gi, st.x);
    // rastro: sombras do ponto que viaja
    for (let k = 1; k <= 8; k++) {
      const xs = xT - k * 0.08 * (fim - dom[0]) / 8;
      if (xs < dom[0]) break;
      ctx.globalAlpha = 0.5 * (1 - k / 9);
      ePonto(ctx, eX(xs), eY(f(xs)), 5, CURVE);
    }
    ctx.globalAlpha = 1;
    if (t < TRAJ) ePonto(ctx, eX(xT), eY(f(xT)), 7, CURVE);
    // interseções: aparecem, vibram e depois mostram as coordenadas
    let ultimo = 0;
    ev.forEach((e, i) => {
      if (t < tEv[i]) return;
      const dt = t - tEv[i];
      const vib = dt < VIB ? (Math.random() * 4 - 2) : 0;
      const px = eX(e.x) + vib, py = eY(e.y) + vib;
      ePonto(ctx, px, py, 7, SEG);
      if (dt < VIB) return;
      // coordenadas: ponto na origem anima x e depois y; nos demais, só a coordenada do eixo
      const d = dt - VIB;
      const xPart = Math.abs(e.y) < 1e-9 && Math.abs(e.x) > 1e-9 ? true : Math.abs(e.x) < 1e-9 && Math.abs(e.y) < 1e-9;
      const yPart = Math.abs(e.x) < 1e-9 || (Math.abs(e.y) < 1e-9 && Math.abs(e.x) < 1e-9);
      const sx = (d < RT) ? 1 + 0.6 * Math.sin(Math.PI * d / RT) : 1;
      const d2 = d - RT;
      const sy = (d2 > 0 && d2 < RT) ? 1 + 0.6 * Math.sin(Math.PI * d2 / RT) : 1;
      const alfa = t > fim ? 1 : 1;
      const fadeOut = Math.max(0, Math.min(1, 1 - (t - (TRAJ + VIB + 2 * RT + 300)) / 900));
      ultimo = Math.max(ultimo, d);
      const txtX = fmt(e.x), txtY = fmt(e.y);
      const tx = px + 10, ty = py - 12;
      ctx.save();
      ctx.globalAlpha = fadeOut;
      ctx.font = 'bold 15px system-ui';
      ctx.fillStyle = css('--tinta');
      ctx.textAlign = 'left';
      ctx.fillText('(', tx, ty);
      const wP = ctx.measureText('(').width;
      ctx.save(); ctx.translate(tx + wP, ty); ctx.scale(xPart ? sx : 1, xPart ? sx : 1); ctx.fillText(txtX, 0, 0); ctx.restore();
      const wX = ctx.measureText(txtX).width * (xPart ? sx : 1);
      ctx.fillText(', ', tx + wP + wX, ty);
      const wC = ctx.measureText(', ').width;
      ctx.save(); ctx.translate(tx + wP + wX + wC, ty); ctx.scale(yPart ? sy : 1, yPart ? sy : 1); ctx.fillText(txtY, 0, 0); ctx.restore();
      const wY = ctx.measureText(txtY).width * (yPart ? sy : 1);
      ctx.fillText(')', tx + wP + wX + wC + wY, ty);
      ctx.restore();
    });
  }

  // Loop de uma ajuda: trava a tela e desenha a animação até o fim
  function eAjuda(gi, tipo) {
    const st = eEst[gi];
    if (st.ajudaAtiva) return;
    st.ajudaAtiva = true;
    const xE = tipo === 'valor' ? (gi === 0 ? -1 : (Math.random() < 0.5 ? -2 : 4)) : null;
    st.ajuda = { tipo, xE, eventos: tipo === 'inter' ? eInterceptos(gi) : null };
    eTrava.hidden = false;
    const t0 = performance.now();
    const fimMs = tipo === 'valor' ? 6600 : 2600 + 1500 + 1200 + 1200 + 600 * 2 + 900;
    const quadro = now => {
      const t = now - t0;
      const ctx = st.canvas.getContext('2d');
      if (tipo === 'valor') eValor(ctx, gi, st, t);
      else eInter(ctx, gi, st, t);
      if (t < fimMs) requestAnimationFrame(quadro);
      else {
        st.ajudaAtiva = false; st.ajuda = null;
        eTrava.hidden = true;
        eDesenhar(gi);
      }
    };
    requestAnimationFrame(quadro);
  }

  // Desenho normal do gráfico, com o estado atual
  function eDesenhar(gi) {
    if (eEst[gi].ajudaAtiva) return;
    eBase(eEst[gi].canvas.getContext('2d'), gi, eEst[gi].x);
  }

  // Atualiza a posição de A e acompanha o domínio percorrido
  function eMover(gi, x) {
    const st = eEst[gi], dom = eG[gi].dom;
    const anterior = st.x;
    st.x = Math.max(dom[0], Math.min(dom[1], x));
    st.min = Math.min(st.min, st.x); st.max = Math.max(st.max, st.x);
    // interceptos e extremos ficam em roxo quando a cruz passa por eles
    (eG[gi].especiais || []).forEach(px => {
      const cruzou = (anterior - px) * (st.x - px) < 0 || (Math.abs(st.x - px) < 0.03 && Math.abs(anterior - px) >= 0.03);
      if (cruzou) st.alc.add(px);
    });
    if (st.fase === 'explorar' && st.min <= dom[0] + 0.05 && st.max >= dom[1] - 0.05) {
      st.fase = 'respostas';
      st.resp.classList.remove('travado');
      st.msg.textContent = 'Agora responda às perguntas.';
    }
    eDesenhar(gi);
  }

  const eTrava = document.createElement('div');
  eTrava.className = 'b3-trava';
  eTrava.hidden = true;
  document.body.appendChild(eTrava);

  const eEst = eG.map(() => ({ fase: 'bloqueado', x: 0, min: 0, max: 0, canvas: null, resp: null, msg: null, ajudaAtiva: false, ajuda: null, done: false, alc: new Set() }));

  // Monta a tela da etapa: primeiro gráfico; o segundo só abre depois de concluir o primeiro
  b3Etapa1.innerHTML = `
    <div class="wrap">
      <header class="stage-top">
        <p class="titulo">Bloco 3 · Descubra com o gráfico</p>
        <p class="identificacao">Valor da função e Interceptos</p>
      </header>
      <div id="b3gs"></div>
      <div class="actions">
        <button data-b3-voltar>← Voltar</button>
        <button class="primary" data-b3-proximo hidden>Próximo gráfico →</button>
      </div>
    </div>`;
  b3Etapa1.appendChild(eTrava);
  const eGs = b3Etapa1.querySelector('#b3gs');
  const eProximo = b3Etapa1.querySelector('[data-b3-proximo]');
  let eGi = 0;

  eG.forEach((G, gi) => {
    const box = document.createElement('div');
    box.className = 'b3-g';
    box.hidden = gi !== 0;
    box.innerHTML = `
      <div class="gwrap">
        <canvas width="${E_W}" height="${E_H}" aria-label="Gráfico da função"></canvas>
        <button class="b3-ajuda" aria-label="Ajuda">?</button>
        <div class="b3-perg">
          <button data-ajuda="valor">Valor da função</button>
          <button data-ajuda="inter">Interceptos</button>
        </div>
        <div class="b3-bloq">Clique aqui e faça o ponto no eixo x percorrer todo o domínio da função.</div>
      </div>
      <div class="b3-resp travado"></div>
      <div class="b3-teclas"></div>
      <p class="b3-msg note"></p>
      <div class="actions"><button class="primary" data-conferir>Conferir</button></div>`;
    eGs.appendChild(box);
    const st = eEst[gi];
    st.canvas = box.querySelector('canvas');
    st.resp = box.querySelector('.b3-resp');
    st.msg = box.querySelector('.b3-msg');
    st.box = box;
    st.perg = box.querySelector('.b3-perg');
    st.bloq = box.querySelector('.b3-bloq');
    st.gerar = () => {
      const reg = eRegistros(gi);
      st.resp.innerHTML = reg.html;
      st.respostas = {};
      st.resp.querySelectorAll('.resp').forEach(i => { st.respostas[i.dataset.k] = Number(i.dataset.v); });
      st.resp.classList.add('travado');
    };
    st.gerar();
    // teclado da tela: o mesmo do bloco 2, com as caixas desta etapa
    st.box.querySelector('.b3-teclas').innerHTML = TECLADO_HTML;
    ligarTeclado(box);

    st.bloq.onclick = () => {
      if (st.fase !== 'bloqueado') return;
      st.fase = 'explorar';
      st.bloq.classList.add('oculto');
      st.msg.textContent = 'Mova a cruz do eixo x por todo o domínio da função.';
    };

    // pontos arrastáveis: cruz de A (eixo x) e cruz de C (eixo y)
    const coords = e => {
      const r = st.canvas.getBoundingClientRect();
      return { x: (e.clientX - r.left) * E_W / r.width, y: (e.clientY - r.top) * E_H / r.height };
    };
    st.canvas.addEventListener('pointerdown', e => {
      if (st.ajudaAtiva || st.fase === 'bloqueado') return;
      const q = coords(e), yG = eG[gi].f(st.x);
      if (Math.hypot(eX(st.x) - q.x, eY(0) - q.y) < 28) st.drag = 'A';
      else if (Math.hypot(eX(0) - q.x, eY(yG) - q.y) < 28) st.drag = 'C';
      if (st.drag) st.canvas.setPointerCapture(e.pointerId);
    });
    st.canvas.addEventListener('pointermove', e => {
      if (!st.drag || st.ajudaAtiva) return;
      const q = coords(e), dom = eG[gi].dom;
      if (st.drag === 'A') eMover(gi, eInvX(q.x));
      else {
        const f = eG[gi].f;
        const vals = [];
        for (let i = 0; i <= 100; i++) vals.push(f(dom[0] + i * (dom[1] - dom[0]) / 100));
        const v = Math.max(Math.min(...vals), Math.min(Math.max(...vals), eInvY(q.y)));
        const r = eRaiz(f, v, dom, st.x);
        if (r !== null) eMover(gi, r);
      }
    });
    const soltar = () => { st.drag = null; };
    st.canvas.addEventListener('pointerup', soltar);
    st.canvas.addEventListener('pointercancel', soltar);

    // ajuda: abre o pergaminho para a esquerda da interrogação
    box.querySelector('.b3-ajuda').onclick = () => {
      if (st.ajudaAtiva) return;
      st.perg.classList.toggle('aberto');
    };
    box.querySelectorAll('[data-ajuda]').forEach(b => {
      b.onclick = () => {
        st.perg.classList.remove('aberto');
        eAjuda(gi, b.dataset.ajuda === 'valor' ? 'valor' : 'inter');
      };
    });

    // conferir as respostas
    box.querySelector('[data-conferir]').onclick = () => {
      if (st.fase !== 'respostas') { st.msg.textContent = 'Primeiro percorra todo o domínio no gráfico.'; return; }
      const valores = st.resp.querySelectorAll('.resp');
      let ok = true;
      valores.forEach(i => {
        const v = lerNumero(i.value);
        if (v === null || Math.abs(v - Number(i.dataset.v)) > 0.05) ok = false;
      });
      if (!ok) { st.msg.textContent = 'Confira as respostas e tente de novo.'; return; }
      st.done = true;
      st.resp.classList.add('travado');
      st.msg.textContent = 'Muito bem!';
      celebrar();
      if (gi < eG.length - 1) eProximo.hidden = false;
      else st.msg.textContent = 'Etapa concluída. Muito bem!';
    };
  });

  // Próximo gráfico só depois de concluir o anterior
  eProximo.onclick = () => {
    if (!eEst[0].done) return;
    eGs.children[0].hidden = true;
    eGs.children[1].hidden = false;
    eProximo.hidden = true;
    eGi = 1;
    eDesenhar(1);
  };
  b3Etapa1.querySelector('[data-b3-voltar]').onclick = () => go(B3_INI);

  // Desenho inicial: primeiro gráfico bloqueado, com a frase de convite
  eDesenhar(0);
  eDesenhar(1);

})();
</script>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Descubra com o gráfico</title>
<style>
  :root {
    --papel: #fffdf5;        /* fundo creme */
    --papel2: #f4eeff;       /* fundo de seções */
    --card: #ffffff;
    --tinta: #241436;
    --tinta-fraca: #6b5b7d;
    --roxo: #473366;
    --roxo-esc: #473366;
    --laranja: #ff6633;
    --borda: #e0d6ee;
    --grade: rgba(75, 0, 130, 0.16);
    --eixo: #2b2140;
    --fundo-grafico: #FAD400;   /* fundo amarelo dos gráficos */
  }
  * { box-sizing: border-box; }
  html, body { overflow-x: hidden; }
  body {
    margin: 0; background: var(--papel); color: var(--tinta);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .deck { position: relative; height: 100vh; height: 100dvh; overflow: hidden; }
  .track { display: flex; height: 100%; transition: transform .5s ease; }
  .slide { flex: 0 0 100%; height: 100%; overflow-y: auto; padding: 0 16px 24px; -webkit-overflow-scrolling: touch; }
  .wrap { max-width: 480px; margin: 0 auto; }

  /* Cabeçalho roxo, com a logo do IFRJ e os textos do professor */
  .hero {
    background: var(--roxo); color: #ffffff;
    margin: 0 -16px; padding: 14px 18px;
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
  }
  .hero img { height: 84px; width: auto; }
  .teacher { text-align: right; line-height: 1.35; }
  .teacher div:first-child { font-weight: 700; font-size: 1.05rem; }
  .teacher div:last-child { font-size: .95rem; opacity: .9; }

  /* Cartões das seções */
  .card-sec {
    background: var(--papel); border: 1px solid var(--borda); border-radius: 14px;
    padding: 16px; margin-top: 16px;
  }
  .b3-tab3 { margin: 0 auto 8px; border-collapse: collapse; font-size: .95rem; }
  .b3-tab3 th, .b3-tab3 td { border: 1px solid var(--borda); padding: 4px 3px; text-align: center; background: #fff; }
  .b3-tab3 th { color: var(--roxo); font-size: .85rem; }
  .b3-tab3 .resp { width: 23px; padding: 2px 0; font: inherit; font-size: .9rem; text-align: center; border: 1.5px solid var(--roxo); border-radius: 6px; background: #fff; color: var(--tinta); }
  .b3c { display: block; margin: 0 auto; background: var(--papel); width: 100%; max-width: 360px; height: auto; }
  .b3-grade { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; max-width: 420px; margin: 0 auto 8px; text-align: center; }
  .b3-grade .cab { font-weight: 700; color: var(--roxo); font-size: .85rem; }
  .b3-grade > div.cel { padding: 8px 4px; border: 1px solid var(--borda); border-radius: 10px; background: #fff; font-size: .95rem; }
  .b3-grade .resp { width: 46px; padding: 3px; font: inherit; text-align: center; border: 1.5px solid var(--roxo); border-radius: 8px; background: #fff; color: var(--tinta); }
  .card-sec h2 { font-size: 1.05rem; margin: 0 0 8px; color: var(--roxo); display: flex; align-items: center; gap: 8px; }
  .num {
    width: 26px; height: 26px; border-radius: 50%; background: var(--roxo); color: #ffffff;
    display: inline-flex; align-items: center; justify-content: center; font-size: .9rem; flex: 0 0 auto;
  }

  h1 { font-size: 1.35rem; margin: 20px 0 6px; text-align: center; color: var(--roxo); }
  p.lead { color: var(--tinta-fraca); margin: 0 0 12px; text-align: center; }
  .note { color: var(--tinta-fraca); font-size: .92rem; text-align: center; margin: 0; }
  .center { text-align: center; }

  /* Cabeçalho da etapa: título, identificação e instrução */
  .stage-top { text-align: center; padding-top: 16px; }
  .stage-top .titulo { margin: 0; font-size: 1rem; color: var(--tinta-fraca); font-weight: 600; }
  .stage-top .identificacao { margin: 2px 0 0; font-size: 1.6rem; font-weight: 800; color: var(--roxo); }
  .stage-top .instrucao { margin: 4px 0 0; font-weight: 600; min-height: 1.5em; color: var(--laranja); }

  /* Seção intermediária: setas à esquerda, botões à direita */
  .stage-mid {
    display: flex; justify-content: space-between; align-items: center;
    gap: 8px; flex-wrap: wrap; margin: 12px 0;
  }
  .setas { display: flex; gap: 6px; }
  .botoes { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; flex: 1 1 auto; }

  .icon {
    width: 44px; height: 44px; padding: 0; border-radius: 50%; display: inline-flex;
    align-items: center; justify-content: center; cursor: pointer;
    border: 1.5px solid var(--roxo); background: var(--card); color: var(--roxo);
  }
  .icon svg { width: 22px; height: 22px; }
  .icon[hidden] { display: none; }

  button {
    font: inherit; padding: 10px 14px; min-height: 44px; border-radius: 12px; cursor: pointer;
    border: 1.5px solid var(--borda); background: var(--card); color: var(--roxo);
  }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--roxo); border-color: var(--roxo); color: #ffffff; font-weight: 700; }
  button[aria-pressed="true"] { background: var(--roxo); border-color: var(--roxo); color: #ffffff; }

  /* Seção de base: navegação de gráficos e gráfico */
  .stage-base { margin-top: 4px; }
  .graph-nav { display: flex; align-items: center; gap: 12px; justify-content: center; margin-bottom: 8px; }
  .graph-nav h2 { font-size: 1.1rem; margin: 0; color: var(--tinta); }
  .stage-base canvas {
    display: block; width: 100%; max-width: 420px; height: auto; margin: 0 auto;
    background: var(--fundo-grafico); border: 1px solid var(--borda); border-radius: 14px; cursor: pointer;
  }

  .avatars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; max-width: 360px; margin: 14px auto; }
  .avatar { padding: 10px 4px 8px; min-height: 0; border-radius: 14px; border: 2px solid var(--borda); background: var(--card); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .avatar .rosto { font-size: 2.4rem; line-height: 1; }
  .avatar small { font-size: .75rem; color: var(--tinta-fraca); font-weight: 600; }
  .avatar[aria-pressed="true"] { border-color: var(--roxo); background: var(--papel2); }
  .name-label { display: block; max-width: 360px; margin: 8px auto 6px; font-weight: 700; text-align: left; color: var(--roxo); }
  .name-input {
    display: block; width: 100%; max-width: 360px; margin: 0 auto; font: inherit; padding: 10px;
    border-radius: 12px; border: 1.5px solid var(--borda); background: var(--card); color: var(--tinta);
  }
  .actions { display: flex; justify-content: space-between; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
  .stage-base canvas { touch-action: none; }
  .formula { text-align: center; margin: 0 0 6px; font-weight: 600; color: var(--tinta-fraca); }
  .icon.pulsar { animation: pulsar 1.2s ease-in-out infinite; }
  @keyframes pulsar {
    0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 102, 51, .7); }
    50% { transform: scale(1.15); box-shadow: 0 0 0 10px rgba(255, 102, 51, 0); }
  }
  .gwrap { position: relative; max-width: 420px; margin: 0 auto; }
  .qbox {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; padding: 16px; border-radius: 14px; text-align: center;
    background: rgba(255, 253, 245, 0.9); color: var(--tinta); font-weight: 600;
  }
  .qbox[hidden] { display: none; }
  .qbox input {
    width: 76px; font: inherit; padding: 6px; text-align: center; background: #ffffff;
    border: 1.5px solid var(--roxo); border-radius: 10px; color: var(--tinta);
  }
  .qbotoes { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .qbox input.ativo { border-color: var(--laranja); animation: piscaCampo 1s steps(1) infinite; }
  @keyframes piscaCampo {
    0%, 100% { box-shadow: 0 0 0 3px rgba(255, 102, 51, .45); }
    50% { box-shadow: 0 0 0 3px rgba(255, 102, 51, 0); }
  }
  .teclado { display: grid; grid-template-columns: repeat(4, 52px); gap: 6px; justify-content: center; }
  .teclado button { width: 52px; min-height: 44px; padding: 0; font-size: 1.1rem; }
  .fim-botoes { display: grid; gap: 10px; max-width: 320px; margin: 16px auto; }
  #festa { position: fixed; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
  @media (prefers-reduced-motion: reduce) {
    .icon.pulsar { animation: none; box-shadow: 0 0 0 3px #FF6633; }
  }

  /* Mini-tutorial da página de instruções */
  .tut { position: relative; margin-top: 12px; }
  .legenda {
    background: var(--roxo); color: #ffffff; border-radius: 12px; padding: 10px 14px;
    text-align: center; font-weight: 600; min-height: 3.2em; display: flex; flex-direction: column; justify-content: center;
  }
  .legenda small { font-size: .78rem; opacity: .85; font-weight: 600; }
  .demo { position: relative; margin-top: 8px; border: 1px solid var(--borda); border-radius: 14px; padding: 4px 8px 10px; background: var(--card); }
  .demo.passivo { pointer-events: none; }
  .demo .stage-top { padding-top: 8px; }
  .demo .stage-base canvas { max-width: 300px; }
  .destaque {
    position: absolute; border: 2px dashed var(--laranja); border-radius: 12px; pointer-events: none;
    transition: all .4s ease; z-index: 4;
  }
  .dedo {
    position: absolute; left: 0; top: 0; font-size: 34px; line-height: 1; pointer-events: none;
    transition: transform .6s ease; z-index: 6; will-change: transform;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,.25));
  }
  .toque {
    position: absolute; left: 0; top: 0; width: 40px; height: 40px; margin: -20px 0 0 -20px;
    border-radius: 50%; border: 3px solid var(--laranja); opacity: 0; pointer-events: none; z-index: 5;
  }
  .toque.on { animation: ondas .6s ease-out; }
  @keyframes ondas {
    0% { opacity: .9; transform: scale(.4); }
    100% { opacity: 0; transform: scale(1.6); }
  }
  @media (prefers-reduced-motion: reduce) {
    .dedo, .destaque, .track { transition: none; }
    .toque.on { animation: none; }
  }
</style>
</head>
<body>
<div class="deck">
  <div class="track" id="track">

    <!-- Slide 0: início (identificação) -->
    <section class="slide">
      <header class="hero">
        <img src="ifrj_logo_branca.png" alt="Logo do IFRJ Campus Nilópolis">
        <div class="teacher">
          <div>Matemática</div>
          <div>Prof. André Silva</div>
        </div>
      </header>
      <div class="wrap">
        <div class="card-sec center">
          <h1>Descubra com o gráfico</h1>
          <label class="name-label" for="studentName">Nome do estudante</label>
          <input class="name-input" type="text" id="studentName" autocomplete="name" placeholder="Digite seu nome">
          <p class="lead" style="margin-top:16px">Como você está se sentindo agora?</p>
          <div class="avatars" id="avatars"></div>
          <p class="note" id="avatarMsg">Digite seu nome e escolha uma carinha para continuar.</p>
          <div class="actions" style="justify-content:center">
            <button class="primary" id="startBtn" data-next disabled>Começar</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Slide 1: instruções com mini-tutorial -->
    <section class="slide">
      <header class="hero">
        <img src="ifrj_logo_branca.png" alt="Logo do IFRJ Campus Nilópolis">
        <div class="teacher">
          <div>Matemática</div>
          <div>Prof. André Silva</div>
        </div>
      </header>
      <div class="wrap">
        <div class="card-sec">
          <h2><span class="num">i</span> Como usar</h2>
          <p class="note" style="text-align:left">Veja o que cada parte da tela faz. Depois é a sua vez.</p>

          <div class="tut" id="tut">
            <div class="legenda" id="legenda"><span>Preparando...</span><small id="contador"></small></div>
            <div class="demo passivo" id="demo"></div>
            <div class="destaque" id="destaque" hidden></div>
            <div class="toque" id="toque"></div>
            <div class="dedo" id="dedo" hidden>👆</div>
          </div>

          <div class="actions">
            <button id="verDeNovo">Ver de novo</button>
            <button id="pular">Pular</button>
          </div>
        </div>

        <div class="actions">
          <button data-prev>← Voltar</button>
          <button class="primary" id="comecarBtn" data-go="2" disabled>Começar →</button>
        </div>
      </div>
    </section>

    <!-- Slides 2 a 5: etapas da atividade são criadas pelo script -->

  </div>
</div>

<script>
(() => {
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const CURVE = '#473366';   // cor dos gráficos (destaques e âncoras)
  const SEG = '#E07415';     // cor dos intervalos no eixo x
  const PI = Math.PI;
  const WIN = { x0: -6, x1: 6, y0: -6, y1: 6 };
  const N = 1200;
  const DUR = 1500;          // duração da animação de cada propriedade, em ms

  // Como o estudante está se sentindo (id é o que será registrado)
  const MOODS = [
    { id: 'muito_feliz', nome: 'Muito feliz', rosto: '😄' },
    { id: 'feliz', nome: 'Feliz', rosto: '🙂' },
    { id: 'indiferente', nome: 'Indiferente', rosto: '😐' },
    { id: 'triste', nome: 'Triste', rosto: '😞' }
  ];

  // Funções da atividade. Cada uma pode ter janela própria (win), grade (grid),
  // extremidades finitas (finiteEdges) e rótulos do fim acima do eixo (labelsAbove).
  // dom: domínio e img: imagem, como intervalos [início, fim] (±Infinity = sem limite)
  // local: true quando o gráfico recebe o rótulo "Local" nos máximos e mínimos
  const FUNCS = [
    { f: x => x * x - 4, dom: [-Infinity, Infinity], img: [-4, Infinity], local: false },
    { f: x => x ** 3 / 4 - 3 * x, dom: [-Infinity, Infinity], img: [-Infinity, Infinity], local: true },
    { f: x => 3 * Math.sin(x),
      win: { x0: -2 * PI, x1: 2 * PI }, finiteEdges: true, labelsAbove: true,
      grid: [-2 * PI, -1.5 * PI, -PI, -PI / 2, 0, PI / 2, PI, 1.5 * PI, 2 * PI],
      dom: [-Infinity, Infinity], img: [-3, 3], local: true },
    { f: x => -((x - 1) ** 2) + 3, dom: [-Infinity, Infinity], img: [-Infinity, 3], local: true },
    { f: x => Math.sqrt(x + 5) - 2, dom: [-5, Infinity], img: [-2, Infinity], local: false },
    { f: x => Math.abs(x + 2) - 1, dom: [-Infinity, Infinity], img: [-1, Infinity], local: true }
  ];

  // Etapas e botões de cada etapa
  const ETAPAS = [
    { nome: 'Domínio e Imagem', botoes: ['dominio', 'imagem'] },
    { nome: 'Sinais', botoes: ['positiva', 'negativa'] },
    { nome: 'Extremos', botoes: ['maximo', 'minimo'] },
    { nome: 'Crescimento', botoes: ['crescente', 'decrescente'] },
    { nome: 'Raízes e Interceptos', botoes: ['raizes', 'intercepto'] }
  ];
  const LABELS = {
    dominio: 'Domínio', imagem: 'Imagem',
    positiva: 'Positiva', negativa: 'Negativa', maximo: 'Máximo', minimo: 'Mínimo',
    crescente: 'Crescente', decrescente: 'Decrescente', raizes: 'Raízes', intercepto: 'Intercepto em Y'
  };
  const COLORS_ORDER = ['dominio', 'imagem', 'positiva', 'negativa', 'crescente', 'decrescente', 'maximo', 'minimo', 'raizes', 'intercepto'];
  const INTERVALOS = ['positiva', 'negativa', 'crescente', 'decrescente'];

  const ICON_PREV = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const ICON_NEXT = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  const fmt = v => (Math.abs(v) < 1e-9 ? 0 : Number(v)).toLocaleString('pt-BR', { maximumFractionDigits: 2 });
  const ease = t => 1 - Math.pow(1 - Math.max(0, Math.min(1, t)), 3);
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  // ---------- geometria e desenho ----------
  function mapper(c, fn) {
    const w = (fn && fn.win) || WIN;
    return {
      X: x => (x - w.x0) / (w.x1 - w.x0) * c.width,
      Y: y => c.height - (y - WIN.y0) / (WIN.y1 - WIN.y0) * c.height
    };
  }

  function drawAxes(ctx, c, M, fn) {
    const xt = (fn && fn.grid) || [-6, -4, -2, 0, 2, 4, 6];
    ctx.clearRect(0, 0, c.width, c.height);
    ctx.strokeStyle = css('--grade'); ctx.lineWidth = 1;
    for (const v of xt) { ctx.beginPath(); ctx.moveTo(M.X(v), 0); ctx.lineTo(M.X(v), c.height); ctx.stroke(); }
    for (let v = -6; v <= 6; v += 2) { ctx.beginPath(); ctx.moveTo(0, M.Y(v)); ctx.lineTo(c.width, M.Y(v)); ctx.stroke(); }
    ctx.strokeStyle = css('--eixo'); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, M.Y(0)); ctx.lineTo(c.width, M.Y(0));
    ctx.moveTo(M.X(0), 0); ctx.lineTo(M.X(0), c.height); ctx.stroke();
  }

  function strokePath(ctx, xs, ys, M, flags) {
    ctx.beginPath();
    let pen = false;
    for (let i = 0; i < xs.length; i++) {
      if ((flags && !flags[i]) || !Number.isFinite(ys[i])) { pen = false; continue; }
      const X = M.X(xs[i]), Y = M.Y(ys[i]);
      if (!pen) { ctx.moveTo(X, Y); pen = true; } else ctx.lineTo(X, Y);
    }
    ctx.stroke();
  }

  function dot(ctx, x, y, r, col) {
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }

  // Escreve um texto com fundo da cor do gráfico, para que ele não se misture à curva
  function numLabel(ctx, c, txt, x, y, align, cor) {
    const w = ctx.measureText(txt).width;
    let left = align === 'right' ? x - w : align === 'left' ? x : x - w / 2;
    left = Math.max(2, Math.min(c.width - w - 2, left));
    ctx.fillStyle = css('--fundo-grafico');
    ctx.fillRect(left - 3, y - 14, w + 6, 18);
    ctx.fillStyle = cor || css('--tinta');
    ctx.textAlign = 'left';
    ctx.fillText(txt, left, y);
  }

  // ---------- análise numérica da função ----------
  const d1 = (f, x) => (f(x + 1e-5) - f(x - 1e-5)) / 2e-5;
  const PRED = {
    positiva: (f, x) => f(x) > 0,
    negativa: (f, x) => f(x) < 0,
    crescente: (f, x) => d1(f, x) > 0,
    decrescente: (f, x) => d1(f, x) < 0
  };

  // Encontra a fronteira entre dois pontos onde g muda de valor
  function bisect(lo, hi, g) {
    const gl = g(lo);
    for (let k = 0; k < 60; k++) {
      const m = (lo + hi) / 2;
      if (g(m) === gl) lo = m; else hi = m;
    }
    return (lo + hi) / 2;
  }

  function analyze(fn) {
    if (fn.A) return fn.A;
    const w = fn.win || WIN;
    const L = w.x0, R = w.x1, step = (R - L) / N;
    const xs = [], ys = [];
    for (let i = 0; i <= N; i++) { const x = L + i * step; xs.push(x); ys.push(fn.f(x)); }

    const flags = {}, intervals = {};
    for (const p of INTERVALOS) {
      const g = x => PRED[p](fn.f, x);
      const ok = xs.map(g);
      flags[p] = ok;
      const ivs = [];
      let start = null;
      for (let i = 0; i <= N; i++) {
        if (ok[i] && start === null) start = i;
        if ((!ok[i] || i === N) && start !== null) {
          const endI = ok[i] ? i : i - 1;
          const aInf = start === 0 && !fn.finiteEdges;
          const bInf = endI === N && !fn.finiteEdges;
          const a = start === 0 ? L : bisect(xs[start - 1], xs[start], g);
          const b = endI === N ? R : bisect(xs[endI], xs[endI + 1], g);
          ivs.push({ a, b, aInf, bInf });
          start = null;
        }
      }
      intervals[p] = ivs;
    }

    // Máximos e mínimos: troca de sinal da derivada
    const extrema = [];
    const gp = x => d1(fn.f, x) > 0;
    for (let i = 0; i < N; i++) {
      const a = gp(xs[i]), b = gp(xs[i + 1]);
      if (a !== b) {
        const x0 = bisect(xs[i], xs[i + 1], gp);
        const y0 = fn.f(x0);
        if (Number.isFinite(y0)) extrema.push({ x: x0, y: y0, tipo: a ? 'maximo' : 'minimo' });
      }
    }

    // Raízes: pontos em que a função troca de sinal (ou é zero)
    const roots = [];
    for (let i = 0; i <= N; i++) {
      const y = ys[i];
      if (!Number.isFinite(y)) continue;
      if (y === 0) { roots.push(xs[i]); continue; }
      if (i < N && Number.isFinite(ys[i + 1]) && ys[i + 1] !== 0 && (y > 0) !== (ys[i + 1] > 0)) {
        roots.push(bisect(xs[i], xs[i + 1], x => fn.f(x) > 0));
      }
    }
    const uniqueRoots = roots.filter((r, k) => k === 0 || Math.abs(r - roots[k - 1]) > 1e-6);

    fn.A = { xs, ys, flags, intervals, extrema, roots: uniqueRoots };
    return fn.A;
  }

  // Animação de intervalos (crescente, decrescente, positiva, negativa)
  // Fases: 0 a 0.6 = âncoras descem até o eixo x; 0.6 a 1 = valores e segmento aparecem
  function drawIntervals(ctx, c, M, fn, p, A, prog) {
    const col = CURVE;
    const pa = ease(prog / 0.6), pl = ease((prog - 0.6) / 0.4), y0 = M.Y(0);
    // no gráfico 3, o fim do intervalo fica acima do eixo e o início, abaixo
    const lyEnd = fn.labelsAbove ? y0 - 10 : y0 + 18;
    for (const iv of A.intervals[p]) {
      // segmento e valores primeiro, para que as âncoras fiquem por cima
      if (pl > 0) {
        const xa = M.X(iv.a), xb = M.X(iv.b);
        ctx.strokeStyle = SEG; ctx.lineWidth = 8; ctx.globalAlpha = .9;
        ctx.beginPath(); ctx.moveTo(xa, y0); ctx.lineTo(xa + (xb - xa) * pl, y0); ctx.stroke();
        ctx.globalAlpha = pl;
        ctx.font = 'bold 15px system-ui';
        // infinito fica acima do eixo; números afastam-se do segmento
        if (iv.aInf) numLabel(ctx, c, '−∞', xa, y0 - 10, 'center');
        else numLabel(ctx, c, fmt(iv.a), xa - 6, y0 + 18, 'right');
        if (iv.bInf) numLabel(ctx, c, '+∞', xb, y0 - 10, 'center');
        else numLabel(ctx, c, fmt(iv.b), xb + 6, lyEnd, 'left');
        ctx.globalAlpha = 1;
      }
      for (const e of [{ x: iv.a, inf: iv.aInf }, { x: iv.b, inf: iv.bInf }]) {
        if (e.inf || !Number.isFinite(fn.f(e.x))) continue;
        const px = M.X(e.x), py = M.Y(fn.f(e.x));
        const cy = py + (y0 - py) * pa;
        // a linha tracejada liga o ponto da curva à âncora, que permanece no eixo ao final
        ctx.setLineDash([4, 4]); ctx.strokeStyle = col; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px, cy); ctx.stroke();
        ctx.setLineDash([]);
        dot(ctx, px, cy, 6, col);
      }
    }
  }

  // Animação de máximos e mínimos: só a âncora no eixo y e o valor de y
  function drawExtrema(ctx, c, M, p, A, prog) {
    const col = CURVE;
    const pa = ease(prog / 0.6), pl = ease((prog - 0.6) / 0.4);
    for (const e of A.extrema) {
      if (e.tipo !== p) continue;
      const px = M.X(e.x), py = M.Y(e.y);
      const sx = M.X(0), sy = py;   // âncora apenas no eixo y, na altura do ponto
      const vx = px + (sx - px) * pa, vy = py + (sy - py) * pa;
      ctx.setLineDash([4, 4]); ctx.strokeStyle = col; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(vx, vy); ctx.stroke();
      ctx.setLineDash([]);
      dot(ctx, vx, vy, 5, col);
      dot(ctx, px, py, 6, col);
      if (pl > 0) {
        ctx.globalAlpha = pl;
        ctx.font = 'bold 15px system-ui';
        numLabel(ctx, c, fmt(e.y), sx + 6, py - 6, 'left');
        ctx.globalAlpha = 1;
      }
    }
  }

  // Raízes: valor de x de cada ponto, abaixo do eixo, do lado em que a curva não passa
  function drawRoots(ctx, c, M, fn, A, prog) {
    const pl = ease(prog);
    if (pl <= 0) return;
    const y0 = M.Y(0);
    ctx.globalAlpha = pl;
    ctx.font = 'bold 15px system-ui';
    for (const r of A.roots) {
      const right = fn.f(r + 1e-4) > 0;
      numLabel(ctx, c, fmt(r), right ? M.X(r) + 6 : M.X(r) - 6, y0 + 18, right ? 'left' : 'right');
    }
    ctx.globalAlpha = 1;
  }

  // Intercepto em Y: valor de y do ponto, do lado oposto à curva
  function drawIntercept(ctx, c, M, fn, prog) {
    const pl = ease(prog);
    const y = fn.f(0);
    if (pl <= 0 || !Number.isFinite(y)) return;
    const sx = M.X(0), py = M.Y(y);
    const slope = d1(fn.f, 0);
    ctx.globalAlpha = pl;
    ctx.font = 'bold 15px system-ui';
    if (Math.abs(slope) < 1e-6) {
      // ponto de máximo ou mínimo: o rótulo vai para o lado vazio
      const curv = fn.f(1e-3) + fn.f(-1e-3) - 2 * y;
      if (curv > 0) numLabel(ctx, c, fmt(y), sx, py + 18, 'center');
      else numLabel(ctx, c, fmt(y), sx, py - 12, 'center');
    } else if (slope > 0) {
      numLabel(ctx, c, fmt(y), sx - 8, py - 10, 'right');
    } else {
      numLabel(ctx, c, fmt(y), sx + 8, py - 10, 'left');
    }
    ctx.globalAlpha = 1;
  }

  // ---------- rótulos em posição livre da curva ----------
  // Cada rótulo testa candidatos em ordem de preferência e usa o primeiro que não toca a curva
  const dentro = (c, q) => q.x >= 14 && q.x <= c.width - 14 && q.y >= 16 && q.y <= c.height - 6;

  function candX(xa, y0) {
    const out = [];
    for (const dx of [0, -12, 12, -24, 24, -36, 36, -48, 48])
      for (const dy of [18, -10, 34, -26]) out.push({ x: xa + dx, y: y0 + dy, align: 'center' });
    return out;
  }

  function candY(ya, sx) {
    const out = [];
    for (const dy of [0, -14, 14, -28, 28, -42, 42])
      out.push({ x: sx + 10, y: ya + dy, align: 'left' }, { x: sx - 10, y: ya + dy, align: 'right' });
    return out;
  }

  // Locais para o rótulo "IR", espalhados pelo eixo escolhido
  function candsIR(c, eixo, fixo) {
    // frações evitam o centro, onde os eixos se cruzam
    const fr = eixo === 'x' ? [0.25, 0.75, 0.15, 0.85, 0.35] : [0.25, 0.75, 0.15, 0.85, 0.35];
    let out = [];
    for (const p of fr) out = out.concat(eixo === 'x' ? candX(c.width * p, fixo) : candY(c.height * p, fixo));
    return out.filter(q => dentro(c, q));
  }

  // Rótulo do "Local": abaixo do ponto de mínimo (s = 1) ou acima do de máximo (s = -1)
  function candsLocal(c, px, py, s) {
    const out = [];
    for (const k of [0, 1, 2])
      for (const dx of [0, 14, -14])
        out.push({ x: px + dx, y: py + s * (18 + 16 * k), align: dx === 0 ? 'center' : dx > 0 ? 'left' : 'right' });
    return out.filter(q => dentro(c, q));
  }

  // Pixels da curva no canvas, para testar sobreposição
  function pixelsDaCurva(fn, c) {
    if (fn.px && fn.pxW === c.width) return fn.px;
    const M = mapper(c, fn), A = analyze(fn), pts = [];
    for (let i = 0; i < A.xs.length; i++) {
      if (Number.isFinite(A.ys[i])) pts.push({ x: M.X(A.xs[i]), y: M.Y(A.ys[i]) });
    }
    fn.px = pts; fn.pxW = c.width;
    return pts;
  }

  // Escolhe e guarda (por função e por rótulo) a primeira posição livre da curva
  function posicao(fn, c, ctx, chave, texto, cands) {
    fn.pos = fn.pos || {};
    const k = chave + '|' + texto;
    if (fn.pos[k]) return fn.pos[k];
    ctx.font = 'bold 15px system-ui';
    const w = ctx.measureText(texto).width;
    const pts = pixelsDaCurva(fn, c);
    const livre = q => {
      const l = q.align === 'right' ? q.x - w : q.align === 'left' ? q.x : q.x - w / 2;
      return !pts.some(p => p.x > l - 4 && p.x < l + w + 4 && p.y > q.y - 16 && p.y < q.y + 6);
    };
    const esc = cands.find(livre) || cands[0] || { x: c.width / 2, y: c.height / 2, align: 'center' };
    fn.pos[k] = esc;
    return esc;
  }

  // Ponto do gráfico em que a ordenada vale v: máximo, mínimo ou extremidade (usado para as âncoras da imagem)
  function pontoComY(fn, v) {
    const A = analyze(fn);
    const e = A.extrema.find(q => Math.abs(q.y - v) < 1e-3);
    if (e) return e.x;
    let best = null, dist = Infinity;
    A.xs.forEach((x, i) => {
      const d = Math.abs(A.ys[i] - v);
      if (Number.isFinite(d) && d < dist) { dist = d; best = x; }
    });
    return best;
  }

  // Faixa do domínio (eixo x) ou da imagem (eixo y), com os limites e o rótulo "IR" quando não há limites
  function drawFaixa(ctx, c, M, fn, eixo, par, prog, chave) {
    const [a, b] = par;
    const w = fn.win || WIN;
    const lo = eixo === 'x' ? w.x0 : WIN.y0, hi = eixo === 'x' ? w.x1 : WIN.y1;
    const ini = Math.max(a, lo), fim = Math.min(b, hi);
    const pl = ease(prog / 0.6), pt = ease((prog - 0.5) / 0.5);
    const pA = eixo === 'x' ? M.X(ini) : M.Y(ini), pB = eixo === 'x' ? M.X(fim) : M.Y(fim);
    const fixo = eixo === 'x' ? M.Y(0) : M.X(0);
    const ponta = pA + (pB - pA) * pl;

    // o traço do intervalo é desenhado por último, por cima dos rótulos
    const desenharSegmento = () => {
      ctx.strokeStyle = SEG; ctx.lineWidth = 8; ctx.globalAlpha = .9;
      ctx.beginPath();
      if (eixo === 'x') { ctx.moveTo(pA, fixo); ctx.lineTo(ponta, fixo); }
      else { ctx.moveTo(fixo, pA); ctx.lineTo(fixo, ponta); }
      ctx.stroke();
      ctx.globalAlpha = 1;
    };

    // no domínio, âncoras saem dos pontos da curva e chegam ao eixo x (sem as extremidades infinitas)
    if (eixo === 'x') {
      const pa = ease(prog / 0.6);
      for (const v of [a, b]) {
        if (!Number.isFinite(v) || !Number.isFinite(fn.f(v))) continue;
        const px = M.X(v), py = M.Y(fn.f(v)), cy = py + (fixo - py) * pa;
        ctx.setLineDash([4, 4]); ctx.strokeStyle = CURVE; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px, cy); ctx.stroke();
        ctx.setLineDash([]);
        dot(ctx, px, cy, 6, CURVE);
        dot(ctx, px, py, 6, CURVE);
      }
    }

    // na imagem, âncoras saem dos pontos extremos e chegam ao eixo y (sem as extremidades infinitas)
    if (eixo === 'y') {
      const pa = ease(prog / 0.6);
      for (const v of [a, b]) {
        if (!Number.isFinite(v)) continue;
        const xp = pontoComY(fn, v);
        if (xp === null) continue;
        const px = M.X(xp), py = M.Y(v), cx = px + (fixo - px) * pa;
        ctx.setLineDash([4, 4]); ctx.strokeStyle = CURVE; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(cx, py); ctx.stroke();
        ctx.setLineDash([]);
        dot(ctx, cx, py, 5, CURVE);
        dot(ctx, px, py, 6, CURVE);
      }
    }

    if (pt <= 0) { desenharSegmento(); return; }

    ctx.globalAlpha = pt;
    ctx.font = 'bold 15px system-ui';
    if (a === -Infinity && b === Infinity) {
      const pos = posicao(fn, c, ctx, chave + 'IR', 'IR', candsIR(c, eixo, fixo));
      numLabel(ctx, c, 'IR', pos.x, pos.y, pos.align);
    } else {
      const extremos = [{ v: a, k: 'a' }, { v: b, k: 'b' }];
      for (const e of extremos) {
        const txt = e.v === -Infinity ? '−∞' : e.v === Infinity ? '+∞' : fmt(e.v);
        const anc = Math.max(lo, Math.min(hi, e.v));
        const p = eixo === 'x' ? M.X(anc) : M.Y(anc);
        const cands = eixo === 'x' ? candX(p, fixo) : candY(p, fixo);
        const pos = posicao(fn, c, ctx, chave + e.k, txt, cands.filter(q => dentro(c, q)));
        numLabel(ctx, c, txt, pos.x, pos.y, pos.align);
      }
    }
    desenharSegmento();
    ctx.globalAlpha = 1;
  }

  // "Local" com o intervalo aberto em volta do x do ponto de máximo ou mínimo
  function desenharLocal(ctx, c, M, fn, e, idx) {
    const y0 = M.Y(0), px = M.X(e.x), py = M.Y(e.y);
    const xl = M.X(e.x - 0.6), xr = M.X(e.x + 0.6);
    ctx.strokeStyle = CURVE; ctx.lineWidth = 4; ctx.globalAlpha = .9;
    ctx.beginPath(); ctx.moveTo(xl, y0); ctx.lineTo(xr, y0); ctx.stroke();
    ctx.fillStyle = CURVE; ctx.font = 'bold 20px system-ui';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('(', xl, y0); ctx.fillText(')', xr, y0);
    ctx.textBaseline = 'alphabetic';
    ctx.globalAlpha = 1;

    ctx.font = 'bold 15px system-ui';
    const s = e.tipo === 'minimo' ? 1 : -1;
    const pos = posicao(fn, c, ctx, 'loc' + idx, 'Local', candsLocal(c, px, py, s));
    numLabel(ctx, c, 'Local', pos.x, pos.y, pos.align, CURVE);
  }

  // Desenha a etapa com os destaques estáticos e as animações já feitas ou em andamento
  function drawGraph(st) {
    const fn = FUNCS[st.gi], state = st.states[st.gi];
    const c = st.canvas, ctx = c.getContext('2d'), M = mapper(c, fn), A = analyze(fn);
    drawAxes(ctx, c, M, fn);
    ctx.lineWidth = 2; ctx.strokeStyle = css('--tinta-fraca'); ctx.globalAlpha = .6;
    strokePath(ctx, A.xs, A.ys, M, null);
    ctx.globalAlpha = 1;

    for (const p of COLORS_ORDER) {
      if (!st.active.has(p)) continue;
      if (INTERVALOS.includes(p)) {
        ctx.lineWidth = 6; ctx.strokeStyle = CURVE;
        strokePath(ctx, A.xs, A.ys, M, A.flags[p]);
      } else if (p === 'dominio' || p === 'imagem') {
        // o gráfico inteiro é destacado
        ctx.lineWidth = 6; ctx.strokeStyle = CURVE;
        strokePath(ctx, A.xs, A.ys, M, null);
      } else if (p === 'maximo' || p === 'minimo') {
        A.extrema.forEach((e, idx) => {
          if (e.tipo !== p) return;
          dot(ctx, M.X(e.x), M.Y(e.y), 6, CURVE);
          if (fn.local) desenharLocal(ctx, c, M, fn, e, idx);
        });
      } else if (p === 'raizes') {
        for (const r of A.roots) dot(ctx, M.X(r), M.Y(0), 6, CURVE);
      } else if (p === 'intercepto') {
        const y = fn.f(0);
        if (Number.isFinite(y)) dot(ctx, M.X(0), M.Y(y), 6, CURVE);
      }
    }

    for (const p of COLORS_ORDER) {
      if (!st.active.has(p)) continue;
      let prog = null;
      if (state.current && state.current.prop === p) prog = state.current.p;
      else if (state.done.has(p)) prog = 1;
      if (prog === null) continue;
      if (INTERVALOS.includes(p)) drawIntervals(ctx, c, M, fn, p, A, prog);
      else if (p === 'dominio') drawFaixa(ctx, c, M, fn, 'x', fn.dom, prog, 'dom');
      else if (p === 'imagem') drawFaixa(ctx, c, M, fn, 'y', fn.img, prog, 'img');
      else if (p === 'raizes') drawRoots(ctx, c, M, fn, A, prog);
      else if (p === 'intercepto') drawIntercept(ctx, c, M, fn, prog);
      else drawExtrema(ctx, c, M, p, A, prog);
    }
  }

  // Anima as propriedades ativas, uma após a outra, no gráfico atual da etapa
  function playGraph(st) {
    const state = st.states[st.gi];
    if (state.running) return;
    const queue = COLORS_ORDER.filter(p => st.active.has(p));
    if (!queue.length) return;
    state.running = true; state.done = new Set();
    const token = ++state.token; // invalida animações antigas quando o botão muda
    let i = 0;
    const next = () => {
      if (token !== state.token) return;
      if (i >= queue.length) { state.running = false; state.current = null; drawGraph(st); return; }
      const prop = queue[i++];
      const t0 = performance.now();
      const frame = now => {
        if (token !== state.token) return;
        const p = Math.min(1, (now - t0) / DUR);
        state.current = { prop, p };
        drawGraph(st);
        if (p < 1) requestAnimationFrame(frame);
        else { state.done.add(prop); state.current = null; next(); }
      };
      requestAnimationFrame(frame);
    };
    next();
  }

  // Volta os gráficos da etapa ao aspecto inicial, cancelando animações em andamento
  function resetStage(st) {
    st.states.forEach(s => { s.token++; s.running = false; s.done = new Set(); s.current = null; });
    drawGraph(st);
  }

  // Monta a estrutura de uma etapa dentro de um contêiner (tela ou demonstração)
  function montarEtapa(container, nome) {
    container.innerHTML = `
      <div class="wrap">
        <header class="stage-top">
          <p class="titulo">Descubra com o gráfico</p>
          <p class="identificacao">${nome}</p>
          <p class="instrucao" hidden>Clique em cada gráfico.</p>
        </header>
        <div class="stage-mid">
          <div class="setas">
            <button class="icon" data-stage-prev aria-label="Etapa anterior">${ICON_PREV}</button>
            <button class="icon" data-stage-next aria-label="Próxima etapa">${ICON_NEXT}</button>
          </div>
          <div class="botoes"></div>
        </div>
        <div class="stage-base">
          <div class="graph-nav">
            <div class="setas">
              <button class="icon" data-graph-prev aria-label="Gráfico anterior">${ICON_PREV}</button>
              <button class="icon" data-graph-next aria-label="Próximo gráfico">${ICON_NEXT}</button>
            </div>
            <h2 class="graph-name">Gráfico 1</h2>
          </div>
          <canvas width="360" height="360" aria-label="Gráfico da função"></canvas>
        </div>
      </div>`;
    return {
      canvas: container.querySelector('canvas'),
      hint: container.querySelector('.instrucao'),
      graphName: container.querySelector('.graph-name'),
      nameEl: container.querySelector('.identificacao'),
      botoes: container.querySelector('.botoes'),
      prev: container.querySelector('[data-stage-prev]'),
      next: container.querySelector('[data-stage-next]'),
      graphPrev: container.querySelector('[data-graph-prev]'),
      graphNext: container.querySelector('[data-graph-next]'),
      gi: 0, active: new Set(),
      states: FUNCS.map(() => ({ done: new Set(), current: null, running: false, token: 0 }))
    };
  }

  // Cria os botões de uma etapa; apenas um fica ativo por vez
  function setBotoes(st, keys, aoMudar) {
    st.botoes.innerHTML = '';
    keys.forEach(key => {
      const b = document.createElement('button');
      b.textContent = LABELS[key]; b.setAttribute('aria-pressed', 'false');
      b.onclick = () => {
        const wasOn = st.active.has(key);
        st.active.clear();
        st.botoes.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', 'false'));
        if (!wasOn) { st.active.add(key); b.setAttribute('aria-pressed', 'true'); }
        st.hint.hidden = st.active.size === 0;
        resetStage(st);
        if (st.registrar) st.registrar();
        if (aoMudar) aoMudar(key, !wasOn);
      };
      st.botoes.appendChild(b);
    });
  }

  function mostrarGrafico(st) {
    st.graphName.textContent = `Gráfico ${st.gi + 1}`;
    drawGraph(st);
  }

  // ---------- navegação entre telas ----------
  const track = document.getElementById('track');
  let current = 0;
  function go(i) {
    current = Math.max(0, Math.min(track.children.length - 1, i));
    track.style.transform = `translateX(-${current * 100}%)`;
    track.children[current].scrollTop = 0;
    if (current === 1) iniciarDemonstracao();
    if (current === B3_INI) b3Iniciar(); else b3Parar();
  }
  document.querySelectorAll('[data-next]').forEach(b => b.onclick = () => go(current + 1));
  document.querySelectorAll('[data-prev]').forEach(b => b.onclick = () => go(current - 1));
  document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(Number(b.dataset.go)));

  // ---------- início: nome e carinha ----------
  let mood = null;
  let studentName = '';
  const avBox = document.getElementById('avatars');
  const startBtn = document.getElementById('startBtn');
  const nameInput = document.getElementById('studentName');
  const avatarMsg = document.getElementById('avatarMsg');

  function updateStart() {
    startBtn.disabled = !(mood && studentName);
    if (!studentName) avatarMsg.textContent = 'Digite seu nome e escolha uma carinha para continuar.';
    else if (!mood) avatarMsg.textContent = 'Escolha uma carinha para continuar.';
    else avatarMsg.textContent = 'Pronto! Clique em Começar.';
  }

  nameInput.addEventListener('input', () => {
    studentName = nameInput.value.trim();
    updateStart();
  });

  MOODS.forEach(m => {
    const b = document.createElement('button');
    b.className = 'avatar'; b.setAttribute('aria-pressed', 'false');
    b.setAttribute('aria-label', m.nome);
    b.innerHTML = `<span class="rosto">${m.rosto}</span><small>${m.nome}</small>`;
    b.onclick = () => {
      mood = m.id;
      avBox.querySelectorAll('.avatar').forEach(x => x.setAttribute('aria-pressed', 'false'));
      b.setAttribute('aria-pressed', 'true');
      updateStart();
    };
    avBox.appendChild(b);
  });
  updateStart();

  // ---------- mini-tutorial ----------
  const tut = document.getElementById('tut');
  const demoEl = document.getElementById('demo');
  const legenda = document.getElementById('legenda');
  const contador = document.getElementById('contador');
  const destaque = document.getElementById('destaque');
  const dedo = document.getElementById('dedo');
  const toque = document.getElementById('toque');
  const comecarBtn = document.getElementById('comecarBtn');
  const pularBtn = document.getElementById('pular');
  const verDeNovoBtn = document.getElementById('verDeNovo');

  const demo = montarEtapa(demoEl, ETAPAS[1].nome);   // a demonstração usa a etapa "Sinais"
  let rodada = 0;          // invalida a sequência anterior ao recomeçar
  let emPratica = false;   // true quando é a vez do estudante
  let concluiu = false;

  function setLegenda(texto, passo) {
    legenda.querySelector('span').textContent = texto;
    contador.textContent = passo || '';
  }

  // Posiciona o destaque em volta de um elemento do tutorial
  function destacar(el) {
    if (!el) { destaque.hidden = true; return; }
    const r = el.getBoundingClientRect(), t = tut.getBoundingClientRect();
    destaque.hidden = false;
    Object.assign(destaque.style, {
      left: (r.left - t.left - 6) + 'px', top: (r.top - t.top - 6) + 'px',
      width: (r.width + 12) + 'px', height: (r.height + 12) + 'px'
    });
  }

  // Leva o dedo ao centro do elemento
  function moverDedo(el) {
    const r = el.getBoundingClientRect(), t = tut.getBoundingClientRect();
    const x = r.left - t.left + r.width / 2, y = r.top - t.top + r.height / 2;
    dedo.hidden = false;
    dedo.style.transform = `translate(${x - 10}px, ${y - 6}px)`;
  }

  // Mostra o toque (ondas) no centro do elemento
  function tocar(el) {
    const r = el.getBoundingClientRect(), t = tut.getBoundingClientRect();
    toque.style.left = (r.left - t.left + r.width / 2) + 'px';
    toque.style.top = (r.top - t.top + r.height / 2) + 'px';
    toque.classList.remove('on');
    void toque.offsetWidth;
    toque.classList.add('on');
  }

  // Clique do estudante no gráfico da demonstração
  demo.canvas.addEventListener('click', () => {
    if (demo.active.size) playGraph(demo);
    if (emPratica && !concluiu && demo.active.has('negativa')) {
      concluiu = true;
      setLegenda('Pronto! Agora toque em Começar.');
      comecarBtn.disabled = false;
    }
  });
  demo.graphNext.onclick = () => { demo.gi = (demo.gi + 1) % FUNCS.length; mostrarGrafico(demo); };
  demo.graphPrev.onclick = () => { demo.gi = (demo.gi + FUNCS.length - 1) % FUNCS.length; mostrarGrafico(demo); };

  // Monta a etapa demonstrativa (Sinais ou Extremos), sem navegar entre telas
  function usarEtapa(s) {
    demo.nameEl.textContent = ETAPAS[s].nome;
    demo.active.clear();
    demo.hint.hidden = true;
    setBotoes(demo, ETAPAS[s].botoes, (key, on) => {
      if (emPratica) setLegenda(on ? 'Agora toque no gráfico.' : `Sua vez: toque em "Negativa" e depois no gráfico.`);
    });
    resetStage(demo);
  }

  // Sequência da demonstração: o dedo toca cada parte da tela
  async function executarDemonstracao(id) {
    const vivo = () => id === rodada;
    usarEtapa(1);
    demo.gi = 0; mostrarGrafico(demo);

    setLegenda('Aqui você vê a etapa e o que deve fazer.', '1 de 5');
    destacar(demoEl.querySelector('.stage-top'));
    dedo.hidden = true;
    await sleep(2600); if (!vivo()) return;

    const seta = demoEl.querySelector('[data-stage-next]');
    setLegenda('As setas mudam de etapa. Você escolhe qual visitar.', '2 de 5');
    destacar(seta); moverDedo(seta);
    await sleep(700); if (!vivo()) return;
    tocar(seta); usarEtapa(2); mostrarGrafico(demo);
    await sleep(1200); if (!vivo()) return;

    // "Mínimo" aparece na demonstração porque a parábola do gráfico 1 tem mínimo, mostrando o efeito de forma clara
    const botao = demo.botoes.querySelectorAll('button')[1];
    setLegenda('Os botões mostram o que destacar no gráfico.', '3 de 5');
    destacar(botao); moverDedo(botao);
    await sleep(700); if (!vivo()) return;
    tocar(botao); botao.click();
    await sleep(1400); if (!vivo()) return;

    setLegenda('Toque no gráfico para ver a explicação.', '4 de 5');
    destacar(demo.canvas); moverDedo(demo.canvas);
    await sleep(700); if (!vivo()) return;
    tocar(demo.canvas); playGraph(demo);
    await sleep(2800); if (!vivo()) return;

    const proximoGrafico = demo.graphNext;
    setLegenda('Use as setas para ver outros gráficos.', '5 de 5');
    destacar(proximoGrafico); moverDedo(proximoGrafico);
    await sleep(700); if (!vivo()) return;
    tocar(proximoGrafico); demo.gi = (demo.gi + 1) % FUNCS.length; mostrarGrafico(demo);
    await sleep(1800); if (!vivo()) return;

    praticar();
  }

  // Vez do estudante: ele precisa tocar em "Negativa" e depois no gráfico
  function praticar() {
    rodada++;
    emPratica = true; concluiu = false;
    demoEl.classList.remove('passivo');
    destacar(null); dedo.hidden = true;
    usarEtapa(1); demo.gi = 0; mostrarGrafico(demo);
    setLegenda('Sua vez: toque em "Negativa" e depois no gráfico.', 'Prática');
    comecarBtn.disabled = true;
  }

  function iniciarDemonstracao() {
    rodada++;
    emPratica = false; concluiu = false;
    demoEl.classList.add('passivo');
    comecarBtn.disabled = true;
    executarDemonstracao(rodada);
  }

  // Pular leva direto à primeira atividade do bloco 1
  pularBtn.onclick = () => { rodada++; go(2); };
  verDeNovoBtn.onclick = () => iniciarDemonstracao();

  // ---------- etapas da atividade (uma tela por etapa) ----------
  ETAPAS.forEach((et, s) => {
    const sec = document.createElement('section');
    sec.className = 'slide';
    track.appendChild(sec);
    const st = montarEtapa(sec, et.nome);

    // setas de etapa: a da esquerda some na primeira etapa; a da direita some na última
    st.prev.hidden = s === 0;
    // a última etapa do bloco 1 também tem avanço, que leva ao bloco 2
    st.next.hidden = false;
    st.prev.onclick = () => go(2 + s - 1);
    st.next.onclick = () => { st.next.classList.remove('pulsar'); go(2 + s + 1); };

    // quando o estudante percorre os 6 gráficos nos dois botões, o avanço de etapa pulsa
    st.visitados = new Set();
    st.registrar = () => {
      if (!st.active.size) return;
      st.visitados.add(st.gi + '|' + [...st.active][0]);
      if (st.visitados.size === FUNCS.length * et.botoes.length) st.next.classList.add('pulsar');
    };

    setBotoes(st, et.botoes);

    // navegação entre gráficos: circular (1 volta ao 6 e o 6 avança ao 1)
    st.graphPrev.onclick = () => { st.gi = (st.gi + FUNCS.length - 1) % FUNCS.length; mostrarGrafico(st); st.registrar(); };
    st.graphNext.onclick = () => { st.gi = (st.gi + 1) % FUNCS.length; mostrarGrafico(st); st.registrar(); };

    st.canvas.addEventListener('click', () => {
      if (st.active.size) playGraph(st);
    });

    drawGraph(st);
  });

  // ---------- Bloco 2: pontos sobre os eixos, extremos, raízes e intercepto ----------
  // Janela: x de -6 a 6 e y com a mesma escala (quadrada, unidades iguais)
  const B2W = 360, B2H = 360;
  const B2 = { x0: -6, x1: 6, y0: -6, y1: 6 };
  const INF = Infinity;
  const B2_GRAFICOS = [
    { f: x => (-1 / 3) * (x - 2) * (x + 4), tex: 'f(x) = −⅓(x − 2)(x + 4)' },
    { f: x => -Math.abs((2 / 3) * (x - 2)) + 2, tex: 'g(x) = −|⅔(x − 2)| + 2' },
    { f: x => Math.sqrt(x + 4) - 2, tex: 'h(x) = √(x + 4) − 2' }
  ];

  // Etapas do bloco 2. alvos[g] = extremidades corretas do gráfico g (±INF = sem limite).
  // seg: desenha o segmento entre os pares de pontos. rotulos: mostra o valor ao agarrar.
  // pergunta: depois de agarrar, o estudante responde uma pergunta.
  const B2_ETAPAS = [
    { id: 'dominio', nome: 'Domínio', eixo: 'x', seg: true, rotulos: true,
      alvos: [[-INF, INF], [-INF, INF], [-4, INF]],
      instr: ['Arraste os dois pontos até as extremidades do domínio.'] },
    { id: 'imagem', nome: 'Imagem', eixo: 'y', seg: true, rotulos: true,
      alvos: [[3, -INF], [2, -INF], [-2, INF]],
      instr: ['Arraste os dois pontos até as extremidades da imagem.'] },
    { id: 'positivo', nome: 'Sinal positivo', eixo: 'x', seg: true, rotulos: true,
      alvos: [[-4, 2], [-1, 5], [0, INF]],
      instr: ['Arraste os pontos até os limites dos intervalos em que a função é positiva.'] },
    { id: 'negativo', nome: 'Sinal negativo', eixo: 'x', seg: true, rotulos: true,
      alvos: [[-INF, -4, 2, INF], [-INF, -1, 5, INF], [-4, 0]],
      instr: ['Arraste os pontos até os limites dos intervalos em que a função é negativa.'] },
    { id: 'extremos', nome: 'Extremos', tipo: 'extremo', pergunta: true,
      ext: [{ x: -1, y: 3, tipo: 'maximo' }, { x: 2, y: 2, tipo: 'maximo' }, { x: -4, y: -2, tipo: 'minimo' }],
      instr: ['Arraste a cruz pelo eixo y até a altura de um máximo ou mínimo.'] },
    { id: 'crescente', nome: 'Crescente', eixo: 'x', seg: true, rotulos: true,
      alvos: [[-INF, -1], [-INF, 2], [-4, INF]],
      instr: ['Arraste os pontos até os limites dos intervalos em que a função é crescente.'] },
    { id: 'decrescente', nome: 'Decrescente', eixo: 'x', seg: true, rotulos: true,
      alvos: [[-1, INF], [2, INF], null],
      instr: ['Arraste os pontos até os limites dos intervalos em que a função é decrescente.',
        'Este gráfico não tem intervalo decrescente.'] },
    { id: 'raizes', nome: 'Raízes', eixo: 'x', seg: false, rotulos: false, pergunta: true,
      alvos: [[-4, 2], [-1, 5], [0]], inicio: [0, 0, 4],
      instr: ['Arraste os pontos até as raízes da função.'] },
    { id: 'intercepto', nome: 'Intercepto em Y', eixo: 'y', seg: false, rotulos: true, pergunta: true,
      alvos: [[8 / 3], [2 / 3], [0]], inicio: [0, 0, 4],
      instr: ['Arraste o ponto até o intercepto com o eixo y.'] }
  ];
  const B2_BASE = 2 + ETAPAS.length;   // índice da primeira tela do bloco 2

  const b2X = x => (x - B2.x0) / (B2.x1 - B2.x0) * B2W;
  const b2Y = y => B2H - (y - B2.y0) / (B2.y1 - B2.y0) * B2H;
  const b2InvX = px => B2.x0 + px / B2W * (B2.x1 - B2.x0);
  const b2InvY = py => B2.y0 + (B2H - py) / B2H * (B2.y1 - B2.y0);
  const b2Pos = (eixo, v) => (eixo === 'x' ? { x: b2X(v), y: b2Y(0) } : { x: b2X(0), y: b2Y(v) });
  const b2Limites = eixo => (eixo === 'x' ? [B2.x0, B2.x1] : [B2.y0, B2.y1]);

  // Estado por etapa e gráfico. pronto = pontos agarrados (ou cruz no extremo); done = etapa concluída
  function b2EstadoNovo(k, g) {
    const et = B2_ETAPAS[k];
    if (et.tipo === 'extremo') return { cruz: 0, pronto: false, done: false, celebrou: false };
    const alvos = et.alvos[g];
    if (!alvos) return { pts: [], pronto: true, done: true, celebrou: true };   // nada a marcar
    const ini = et.inicio ? et.inicio[g] : 0;
    return { pts: alvos.map(() => ({ v: ini, claim: -1 })), pronto: false, done: false, celebrou: false };
  }
  const b2Estados = B2_ETAPAS.map((et, k) => B2_GRAFICOS.map((_, g) => b2EstadoNovo(k, g)));

  // Comemoração: breve som e confetes (cerca de 1,5 s)
  const festaCv = document.createElement('canvas');
  festaCv.id = 'festa';
  document.body.appendChild(festaCv);
  function tocarSom() {
    try {
      const au = new (window.AudioContext || window.webkitAudioContext)();
      const t0 = au.currentTime;
      [[523.25, 0], [659.25, 0.13], [783.99, 0.26]].forEach(([freq, dt]) => {
        const o = au.createOscillator(), g = au.createGain();
        o.type = 'triangle'; o.frequency.value = freq;
        o.connect(g); g.connect(au.destination);
        g.gain.setValueAtTime(0.0001, t0 + dt);
        g.gain.exponentialRampToValueAtTime(0.25, t0 + dt + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dt + 0.25);
        o.start(t0 + dt); o.stop(t0 + dt + 0.3);
      });
      setTimeout(() => au.close(), 1200);
    } catch (e) { /* sem som disponível: a comemoração continua visual */ }
  }

  function celebrar() {
    tocarSom();
    festaCv.width = innerWidth; festaCv.height = innerHeight;
    const g = festaCv.getContext('2d');
    const cores = ['#473366', '#FF6633', '#FAD400', '#E07415', '#975FA8', '#1a7f4b'];
    const parts = Array.from({ length: 110 }, () => ({
      x: festaCv.width / 2 + (Math.random() - 0.5) * 80, y: festaCv.height * 0.45,
      vx: (Math.random() - 0.5) * 12, vy: -Math.random() * 10 - 4,
      r: Math.random() * 5 + 3, c: cores[Math.floor(Math.random() * cores.length)],
      rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3
    }));
    const t0 = performance.now();
    const quadro = now => {
      g.clearRect(0, 0, festaCv.width, festaCv.height);
      parts.forEach(p => {
        p.vy += 0.35; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
        g.save(); g.translate(p.x, p.y); g.rotate(p.rot);
        g.fillStyle = p.c; g.fillRect(-p.r, -p.r / 2, p.r * 2, p.r);
        g.restore();
      });
      if (now - t0 < 1500) requestAnimationFrame(quadro);
      else g.clearRect(0, 0, festaCv.width, festaCv.height);
    };
    requestAnimationFrame(quadro);
  }

  // Raiz de f(x) = v mais próxima de xref (null se não houver)
  function b2RaizMaisProxima(f, v, xref) {
    if (Math.abs(f(xref) - v) < 1e-9) return xref;
    const N = 800, L = B2.x0, R = B2.x1, h = (R - L) / N;
    let best = null, bd = Infinity;
    let xa = L, ya = f(L) - v;
    for (let i = 1; i <= N; i++) {
      const xb = L + i * h, yb = f(xb) - v;
      if (Number.isFinite(ya) && Number.isFinite(yb) && (ya > 0) !== (yb > 0)) {
        let lo = xa, hi = xb;
        for (let k = 0; k < 50; k++) {
          const m = (lo + hi) / 2;
          if ((f(m) - v > 0) === (f(lo) - v > 0)) lo = m; else hi = m;
        }
        const r = (lo + hi) / 2, d = Math.abs(r - xref);
        if (d < bd) { bd = d; best = r; }
      }
      xa = xb; ya = yb;
    }
    return best;
  }

  // Lê um número digitado (aceita vírgula e fração, como 8/3)
  function lerNumero(s) {
    // o teclado da tela usa o sinal "−" (U+2212); o número é lido com o hífen comum
    const t = String(s).replace(/−/g, '-').trim();
    if (!t) return null;
    if (t.includes('/')) {
      const [a, b] = t.split('/').map(p => Number(p.trim().replace(',', '.')));
      return b ? a / b : null;
    }
    const v = Number(t.replace(',', '.'));
    return Number.isFinite(v) ? v : null;
  }

  // Desenha o gráfico, os segmentos, os pontos e a cruz
  function b2Draw(st) {
    const k = st.k, et = B2_ETAPAS[k], est = b2Estados[k][st.gi], G = B2_GRAFICOS[st.gi];
    const c = st.canvas, ctx = c.getContext('2d');
    const alvos = et.alvos ? et.alvos[st.gi] : null;
    const [lo, hi] = b2Limites(et.eixo || 'x');
    ctx.clearRect(0, 0, B2W, B2H);

    // grade e marcas inteiras de 1 em 1
    ctx.strokeStyle = css('--grade'); ctx.lineWidth = 1;
    for (let x = B2.x0; x <= B2.x1; x++) { ctx.beginPath(); ctx.moveTo(b2X(x), 0); ctx.lineTo(b2X(x), B2H); ctx.stroke(); }
    for (let y = B2.y0; y <= B2.y1; y++) { ctx.beginPath(); ctx.moveTo(0, b2Y(y)); ctx.lineTo(B2W, b2Y(y)); ctx.stroke(); }
    ctx.strokeStyle = css('--eixo'); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, b2Y(0)); ctx.lineTo(B2W, b2Y(0));
    ctx.moveTo(b2X(0), 0); ctx.lineTo(b2X(0), B2H); ctx.stroke();

    ctx.fillStyle = css('--tinta-fraca'); ctx.font = '12px system-ui';
    ctx.strokeStyle = css('--eixo'); ctx.lineWidth = 1.5;
    for (let x = B2.x0; x <= B2.x1; x++) {
      if (x === 0) continue;
      ctx.beginPath(); ctx.moveTo(b2X(x), b2Y(0) - 3); ctx.lineTo(b2X(x), b2Y(0) + 3); ctx.stroke();
      ctx.textAlign = 'center'; ctx.fillText(String(x), b2X(x), b2Y(0) + 16);
    }
    for (let y = B2.y0; y <= B2.y1; y++) {
      if (y === 0) continue;
      ctx.beginPath(); ctx.moveTo(b2X(0) - 3, b2Y(y)); ctx.lineTo(b2X(0) + 3, b2Y(y)); ctx.stroke();
      ctx.textAlign = 'right'; ctx.fillText(String(y), b2X(0) - 6, b2Y(y) + 4);
    }

    // curva
    ctx.strokeStyle = CURVE; ctx.lineWidth = 3; ctx.beginPath();
    let pen = false;
    for (let i = 0; i <= 300; i++) {
      const x = B2.x0 + i * (B2.x1 - B2.x0) / 300, y = G.f(x);
      if (!Number.isFinite(y)) { pen = false; continue; }
      if (!pen) { ctx.moveTo(b2X(x), b2Y(y)); pen = true; } else ctx.lineTo(b2X(x), b2Y(y));
    }
    ctx.stroke();

    // extremo: cruz sobre o eixo y e ponto sobre a curva, com a mesma ordenada
    if (et.tipo === 'extremo') {
      const ext = et.ext[st.gi];
      const cx = b2X(0), cy = b2Y(est.cruz);
      const xp = est.pronto ? ext.x : b2RaizMaisProxima(G.f, est.cruz, ext.x);
      if (xp !== null) {
        const px = b2X(xp), py = b2Y(est.cruz);
        ctx.setLineDash([4, 4]); ctx.strokeStyle = CURVE; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(px, py); ctx.stroke();
        ctx.setLineDash([]);
        dot(ctx, px, py, 6, CURVE);
      }
      // cruz branca com contorno; pisca enquanto não foi agarrada
      ctx.globalAlpha = est.pronto ? 1 : (st.blinkOn ? 1 : 0.25);
      ctx.lineCap = 'round';
      ctx.strokeStyle = CURVE; ctx.lineWidth = 7; ctx.beginPath();
      ctx.moveTo(cx - 10, cy); ctx.lineTo(cx + 10, cy); ctx.moveTo(cx, cy - 10); ctx.lineTo(cx, cy + 10);
      ctx.stroke();
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3.5; ctx.beginPath();
      ctx.moveTo(cx - 10, cy); ctx.lineTo(cx + 10, cy); ctx.moveTo(cx, cy - 10); ctx.lineTo(cx, cy + 10);
      ctx.stroke();
      ctx.globalAlpha = 1;
      return;
    }

    // segmentos entre pares de extremidades (intervalos)
    if (et.seg && alvos) {
      const clamp = v => Math.max(lo, Math.min(hi, v));
      for (let i = 0; i + 1 < est.pts.length; i += 2) {
        const vals = [est.pts[i], est.pts[i + 1]].map(p => (p.claim >= 0 ? alvos[p.claim] : p.v));
        const a = clamp(Math.min(...vals)), b = clamp(Math.max(...vals));
        const A1 = b2Pos(et.eixo, a), B1 = b2Pos(et.eixo, b);
        ctx.strokeStyle = SEG; ctx.lineWidth = 8; ctx.globalAlpha = .9;
        ctx.beginPath(); ctx.moveTo(A1.x, A1.y); ctx.lineTo(B1.x, B1.y); ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }

    // intercepto: o valor de y do ponto de interseção já aparece antes do arraste
    if (et.id === 'intercepto' && alvos && est.pts.every(p => p.claim < 0)) {
      ctx.font = 'bold 14px system-ui';
      numLabel(ctx, c, fmt(alvos[0]), b2X(0) + 12, b2Y(alvos[0]) - 6, 'left');
    }

    // pontos livres e valores das extremidades agarradas
    ctx.font = 'bold 14px system-ui';
    est.pts.forEach(p => {
      if (p.claim >= 0) {
        const t = alvos[p.claim];
        if (!et.rotulos) {
          // sem rótulo (raízes): o ponto permanece no lugar em que foi agarrado
          if (Number.isFinite(t)) { const q = b2Pos(et.eixo, t); dot(ctx, q.x, q.y, 7, CURVE); }
          return;
        }
        if (et.eixo === 'x') {
          if (t === -INF) numLabel(ctx, c, '−∞', b2X(B2.x0) + 4, b2Y(0) - 12, 'left');
          else if (t === INF) numLabel(ctx, c, '+∞', b2X(B2.x1) - 4, b2Y(0) - 12, 'right');
          else numLabel(ctx, c, fmt(t), b2X(t), b2Y(0) + 26, 'center');
        } else {
          if (t === -INF) numLabel(ctx, c, '−∞', b2X(0) + 12, b2Y(B2.y0) - 6, 'left');
          else if (t === INF) numLabel(ctx, c, '+∞', b2X(0) + 12, b2Y(B2.y1) + 14, 'left');
          else numLabel(ctx, c, fmt(t), b2X(0) + 12, b2Y(t) + 4, 'left');
        }
      } else {
        const q = b2Pos(et.eixo, p.v);
        dot(ctx, q.x, q.y, 10, '#ffffff');
        dot(ctx, q.x, q.y, 7, CURVE);
      }
    });
  }

  // Texto da pergunta de cada etapa, com as caixas de resposta
  function b2MontarPergunta(st) {
    const k = st.k, et = B2_ETAPAS[k], q = st.qbox;
    if (et.tipo === 'extremo') {
      const e = et.ext[st.gi];
      q.innerHTML = `<p>y = ${fmt(e.y)} é máximo ou mínimo?</p>
        <div class="qbotoes"><button data-r="maximo">Máximo</button><button data-r="minimo">Mínimo</button></div>`;
      q.querySelectorAll('[data-r]').forEach(b => {
        b.onclick = () => { if (b.dataset.r === e.tipo) b2Acertou(st); };
      });
    } else if (et.id === 'raizes') {
      const dois = st.gi < 2;
      q.innerHTML = dois
        ? `<p><input class="resp" inputmode="decimal" aria-label="primeira raiz"> e <input class="resp" inputmode="decimal" aria-label="segunda raiz"> são raízes da função.</p><button class="primary" data-ok>Confirmar</button>`
        : `<p><input class="resp" inputmode="decimal" aria-label="raiz"> é uma raiz da função.</p><button class="primary" data-ok>Confirmar</button>`;
      q.querySelector('[data-ok]').onclick = () => {
        const vals = [...q.querySelectorAll('.resp')].map(i => lerNumero(i.value));
        if (vals.some(v => v === null)) return;
        const alvo = et.alvos[st.gi].slice().sort((a, b) => a - b);
        const ord = vals.slice().sort((a, b) => a - b);
        if (ord.length === alvo.length && ord.every((v, i) => Math.abs(v - alvo[i]) < 0.05)) b2Acertou(st);
      };
    } else {
      q.innerHTML = `<p><input class="resp" inputmode="decimal" aria-label="valor"> é imagem do número 0 por esta função.</p><button class="primary" data-ok>Confirmar</button>`;
      q.querySelector('[data-ok]').onclick = () => {
        const v = lerNumero(q.querySelector('.resp').value);
        if (v !== null && Math.abs(v - et.alvos[st.gi][0]) < 0.02) b2Acertou(st);
      };

  }

  // Teclado próprio para as respostas numéricas (com sinal de menos, vírgula e barra)
  const TECLADO_HTML = `<div class="teclado">${['1', '2', '3', '⌫', '4', '5', '6', '−', '7', '8', '9', '/', '0', ','].map(t => `<button type="button" data-t="${t}">${t}</button>`).join('')}</div>`;
  function ligarTeclado(q) {
    const campos = [...q.querySelectorAll('.resp')];
    let ativo = campos[0];
    // o campo que recebe os toques do teclado da tela fica destacado, com um pisca que faz o papel do cursor
    const marcar = c => campos.forEach(x => x.classList.toggle('ativo', x === c));
    campos.forEach(c => {
      c.setAttribute('inputmode', 'none');   // não abre o teclado do aparelho
      // em celular (tela de toque), o campo só recebe o teclado da tela; no computador, digitação normal
      c.readOnly = matchMedia('(pointer: coarse)').matches;
      c.addEventListener('focus', () => { ativo = c; marcar(c); });
    });
    marcar(ativo);
    q.querySelectorAll('.teclado button').forEach(b => {
      b.onclick = () => {
        if (!ativo) return;
        if (b.dataset.t === '⌫') ativo.value = ativo.value.slice(0, -1);
        else ativo.value += b.dataset.t;
      };
    });
  }

  // Resposta correta: comemoração, a tela some e o estudante segue (exceto nos extremos)
  function b2Acertou(st) {
    const k = st.k, g = st.gi, et = B2_ETAPAS[k];
    b2Estados[k][g].done = true;
    celebrar();
    b2Render(st);
    if (et.tipo === 'extremo') return;
    setTimeout(() => {
      if (current !== B2_BASE + k || st.gi !== g) return;
      if (g < B2_GRAFICOS.length - 1) { st.gi = g + 1; b2Render(st); }
      else go(B2_BASE + k + 1);
    }, 1700);
  }

  // Atualiza textos, bloqueios, pulsar, pergunta e desenho
  function b2Render(st) {
    const k = st.k, et = B2_ETAPAS[k], est = b2Estados[k][st.gi];
    st.graphName.textContent = `Gráfico ${st.gi + 1}`;
    st.formula.textContent = B2_GRAFICOS[st.gi].tex;
    const semIntervalo = et.alvos && !et.alvos[st.gi];
    st.instr.textContent = est.done ? 'Pronto! Você já pode avançar.'
      : (semIntervalo ? et.instr[1] : et.instr[0]);
    st.gPrev.disabled = !est.done; st.gNext.disabled = !est.done;
    st.prev.disabled = !est.done; st.next.disabled = !est.done;
    // com todos os gráficos concluídos, o avanço da etapa pisca
    st.next.classList.toggle('pulsar', b2Estados[k].every(e => e.done));

    // pergunta: aparece depois que os pontos (ou a cruz) foram agarrados
    const mostrar = (et.pergunta || et.tipo === 'extremo') && est.pronto && !est.done;
    if (mostrar) {
      const chave = st.gi;
      if (st.qKey !== chave) { b2MontarPergunta(st); st.qKey = chave; }
      st.qbox.hidden = false;
    } else {
      st.qbox.hidden = true;
      st.qKey = null;
    }
    b2Draw(st);
  }

  // Verifica se o ponto agarrou uma extremidade ainda livre
  function b2Tentar(st, idx) {
    const k = st.k, et = B2_ETAPAS[k], est = b2Estados[k][st.gi], alvos = et.alvos[st.gi], p = est.pts[idx];
    const [lo, hi] = b2Limites(et.eixo);
    alvos.forEach((al, j) => {
      if (p.claim >= 0 || est.pts.some(q => q.claim === j)) return;
      // em etapas de intervalos, cada par de pontos só marca as extremidades do seu intervalo
      if (et.seg && Math.floor(j / 2) !== Math.floor(idx / 2)) return;
      const ok = al === -INF ? p.v <= lo + 0.4
        : al === INF ? p.v >= hi - 0.4
          : Math.abs(p.v - al) < 0.4;
      if (ok) p.claim = j;
    });
    if (p.claim >= 0) st.drag = null;   // o ponto agarrado fica preso
    if (!est.pronto && est.pts.every(q => q.claim >= 0)) {
      est.pronto = true;
      if (!et.pergunta) est.done = true;
      if (!est.celebrou) { est.celebrou = true; celebrar(); }
    }
    b2Render(st);
  }

  // Telas do bloco 2: uma por etapa
  const b2Telas = B2_ETAPAS.map((et, k) => {
    const sec = document.createElement('section');
    sec.className = 'slide';
    track.appendChild(sec);
    sec.innerHTML = `
      <div class="wrap">
        <header class="stage-top">
          <p class="titulo">Bloco 2 · Descubra com o gráfico</p>
          <p class="identificacao">${et.nome}</p>
          <p class="instrucao"></p>
        </header>
        <div class="stage-mid">
          <div class="setas">
            <button class="icon" data-stage-prev aria-label="Etapa anterior">${ICON_PREV}</button>
            <button class="icon" data-stage-next aria-label="Próxima etapa">${ICON_NEXT}</button>
          </div>
        </div>
        <div class="stage-base">
          <div class="graph-nav">
            <div class="setas">
              <button class="icon" data-graph-prev aria-label="Gráfico anterior">${ICON_PREV}</button>
              <button class="icon" data-graph-next aria-label="Próximo gráfico">${ICON_NEXT}</button>
            </div>
            <h2 class="graph-name">Gráfico 1</h2>
          </div>
          <p class="formula"></p>
          <div class="gwrap">
            <canvas width="${B2W}" height="${B2H}" aria-label="Gráfico para interagir"></canvas>
            <div class="qbox" hidden></div>
          </div>
        </div>
      </div>`;

    const st = {
      k, gi: 0, drag: null, qKey: null, blinkOn: true,
      canvas: sec.querySelector('canvas'),
      qbox: sec.querySelector('.qbox'),
      instr: sec.querySelector('.instrucao'),
      graphName: sec.querySelector('.graph-name'),
      formula: sec.querySelector('.formula'),
      prev: sec.querySelector('[data-stage-prev]'),
      next: sec.querySelector('[data-stage-next]'),
      gPrev: sec.querySelector('[data-graph-prev]'),
      gNext: sec.querySelector('[data-graph-next]')
    };
    st.prev.hidden = k === 0;
    st.prev.onclick = () => { if (b2Estados[k][st.gi].done) go(B2_BASE + k - 1); };
    st.next.onclick = () => { if (b2Estados[k][st.gi].done) go(B2_BASE + k + 1); };
    st.gPrev.onclick = () => { if (b2Estados[k][st.gi].done) { st.gi = (st.gi + B2_GRAFICOS.length - 1) % B2_GRAFICOS.length; b2Render(st); } };
    st.gNext.onclick = () => { if (b2Estados[k][st.gi].done) { st.gi = (st.gi + 1) % B2_GRAFICOS.length; b2Render(st); } };

    const coords = e => {
      const r = st.canvas.getBoundingClientRect();
      return { x: (e.clientX - r.left) * B2W / r.width, y: (e.clientY - r.top) * B2H / r.height };
    };
    st.canvas.addEventListener('pointerdown', e => {
      const est = b2Estados[k][st.gi], et = B2_ETAPAS[k], q = coords(e);
      if (est.done || est.pronto) return;
      if (et.tipo === 'extremo') {
        if (Math.hypot(b2X(0) - q.x, b2Y(est.cruz) - q.y) < 28) { st.drag = 0; st.canvas.setPointerCapture(e.pointerId); }
        return;
      }
      let best = -1, bd = Infinity;
      est.pts.forEach((p, i) => {
        if (p.claim >= 0) return;
        const pos = b2Pos(et.eixo, p.v), d = Math.hypot(pos.x - q.x, pos.y - q.y);
        if (d < bd) { bd = d; best = i; }
      });
      if (best >= 0 && bd < 28) { st.drag = best; st.canvas.setPointerCapture(e.pointerId); }
    });
    st.canvas.addEventListener('pointermove', e => {
      if (st.drag === null) return;
      const est = b2Estados[k][st.gi], et = B2_ETAPAS[k], q = coords(e);
      if (et.tipo === 'extremo') {
        const ext = et.ext[st.gi];
        const v = Math.max(B2.y0, Math.min(B2.y1, b2InvY(q.y)));
        est.cruz = v;
        if (Math.abs(v - ext.y) < 0.2) {          // a cruz agarra a altura do extremo
          est.cruz = ext.y; est.pronto = true; st.drag = null;
        }

        return;
      }
      const [lo, hi] = b2Limites(et.eixo);
      const v = et.eixo === 'x' ? b2InvX(q.x) : b2InvY(q.y);
      est.pts[st.drag].v = Math.max(lo, Math.min(hi, v));
      b2Tentar(st, st.drag);
    });

    st.canvas.addEventListener('pointerup', soltar);
    st.canvas.addEventListener('pointercancel', soltar);

    st.qbox.addEventListener('pointerdown', e => e.stopPropagation());
    b2Render(st);
    return st;
  });

  // Pisca da cruz da etapa Extremos, enquanto ela não foi agarrada
  setInterval(() => {
    b2Telas.forEach(st => {
      if (B2_ETAPAS[st.k].tipo !== 'extremo') return;

      if (current === B2_BASE + st.k && !b2Estados[st.k][st.gi].pronto) b2Draw(st);

  }, 600);

  // Tela ao terminar o bloco 2
  const fim = document.createElement('section');
  fim.className = 'slide';
  fim.innerHTML = `
    <div class="wrap center">
      <h1>Bloco 2 concluído</h1>
      <p class="lead">Escolha o que fazer agora.</p>

  // ---------- Bloco 3: atalho de teste e tela de instrução com animação ----------
  const B3_INI = track.children.length;   // tela de instrução do bloco 3

  // atalho de teste na tela inicial
  const cardInicial = track.children[0].querySelector('.card-sec');
  const atalho = document.createElement('button');
  atalho.textContent = 'Ir direto ao Bloco 3 (teste)';
  atalho.style.marginBottom = '12px';
  atalho.onclick = () => go(B3_INI);
  cardInicial.insertBefore(atalho, cardInicial.firstChild);

  // Tela de instrução com a animação de exploração
  const b3Tela = document.createElement('section');
  b3Tela.className = 'slide';
  b3Tela.innerHTML = `
    <div class="wrap">
      <header class="stage-top">
        <p class="titulo">Bloco 3 · Descubra com o gráfico</p>
        <p class="identificacao">Reconhecimento e familiarização</p>
      </header>
      <div class="card-sec">
        <p class="b3-texto">Neste bloco você vai explorar gráficos a partir dos valores do domínio e da imagem. Os gráficos são representados com a seguinte convenção:</p>
        <ul class="b3-lista">
          <li>pontos cheios na ponta da linha que é o gráfico significam o primeiro ou o último ponto do gráfico;</li>
          <li>ponto vazio na ponta significa que o gráfico termina sem que este ponto pertença a ele;</li>
          <li>se ao passar por um ponto do gráfico este ponto se mostrar em destaque, ele é um ponto extremo, ou um intercepto com o eixo x ou y.</li>

    </div>`;
  track.appendChild(b3Tela);

  // Placeholder da primeira etapa do bloco 3 (ainda não implementada)
  const b3Etapa1 = document.createElement('section');
  b3Etapa1.className = 'slide';
  b3Etapa1.innerHTML = `
    <div class="wrap center">
      <h1>Bloco 3 · Etapa 1</h1>
      <p class="lead">Valor da função e Interceptos</p>
      <p class="note">Em construção.</p>
      <div class="actions" style="justify-content:center"><button data-prev>← Voltar</button></div>
    </div>`;
  track.appendChild(b3Etapa1);
  b3Etapa1.querySelector('[data-prev]').onclick = () => go(B3_INI);

  // Animação: a cruz do eixo x percorre o domínio (−3 a 4) e mostra os pontos destacados
  const B3F = x => -0.5 * Math.abs(x + 2) + 2;   // f(x) = −½|x + 2| + 2, domínio [−3, 4]
  const B3_DOM = [-3, 4];
  const B3_CICLO = 10000;   // ms
  const b3c = b3Tela.querySelector('.b3c');
  const b3ctx = b3c.getContext('2d');
  const b3X = x => (x + 4.5) * 40;     // 40 px por unidade (escala igual nos dois eixos)
  const b3Y = y => 300 - (y + 2.5) * 40;

  function b3Desenhar(t) {
    const ctx = b3ctx, W = b3c.width, H = b3c.height;
    const T = t % B3_CICLO;
    const s = Math.max(0, Math.min(1, (T - 1000) / 6000));   // percurso de −3 a 4
    const x = B3_DOM[0] + (B3_DOM[1] - B3_DOM[0]) * s;
    ctx.clearRect(0, 0, W, H);

    // grade e eixos
    ctx.strokeStyle = css('--grade'); ctx.lineWidth = 1;
    for (let v = -4; v <= 4; v++) { ctx.beginPath(); ctx.moveTo(b3X(v), 0); ctx.lineTo(b3X(v), H); ctx.stroke(); }
    for (let v = -2; v <= 5; v++) { ctx.beginPath(); ctx.moveTo(0, b3Y(v)); ctx.lineTo(W, b3Y(v)); ctx.stroke(); }
    ctx.strokeStyle = css('--eixo'); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, b3Y(0)); ctx.lineTo(W, b3Y(0)); ctx.moveTo(b3X(0), 0); ctx.lineTo(b3X(0), H); ctx.stroke();

    // gráfico no domínio
    ctx.strokeStyle = CURVE; ctx.lineWidth = 3; ctx.beginPath();
    for (let i = 0; i <= 140; i++) {
      const xx = B3_DOM[0] + i * (B3_DOM[1] - B3_DOM[0]) / 140;
      if (i === 0) ctx.moveTo(b3X(xx), b3Y(B3F(xx))); else ctx.lineTo(b3X(xx), b3Y(B3F(xx)));
    }
    ctx.stroke();

    // extremidades do domínio: cheias (o gráfico inclui os dois extremos)
    dot(ctx, b3X(-3), b3Y(B3F(-3)), 6, CURVE);
    dot(ctx, b3X(4), b3Y(B3F(4)), 6, CURVE);

    // pontos destacados conforme a cruz passa por eles
    const anel = (px, py) => { ctx.strokeStyle = SEG; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(px, py, 10, 0, Math.PI * 2); ctx.stroke(); };
    if (x >= -2) anel(b3X(-2), b3Y(2));    // máximo
    if (x >= 2) anel(b3X(2), b3Y(0));      // intercepto com o eixo x
    if (x >= 0) anel(b3X(0), b3Y(1));      // intercepto com o eixo y
    if (x >= 4 || T < 1000) { /* extremidades já cheias acima */ }

    // âncoras: cruz em A (eixo x), G na curva e cruz em C (eixo y)
    const yG = B3F(x), ax = b3X(x), ay = b3Y(0), gx = b3X(x), gy = b3Y(yG), cy = b3Y(yG);
    ctx.setLineDash([4, 4]); ctx.strokeStyle = CURVE; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(gx, gy); ctx.moveTo(gx, gy); ctx.lineTo(b3X(0), cy); ctx.stroke();
    ctx.setLineDash([]);
    cruz(ctx, ax, ay);
    cruz(ctx, b3X(0), cy);
    dot(ctx, gx, gy, 6, CURVE);
  }

  // Cruz branca com contorno, como no restante do aplicativo
  function cruz(ctx, x, y) {
    ctx.lineCap = 'round';
    ctx.strokeStyle = CURVE; ctx.lineWidth = 7; ctx.beginPath();
    ctx.moveTo(x - 10, y); ctx.lineTo(x + 10, y); ctx.moveTo(x, y - 10); ctx.lineTo(x, y + 10); ctx.stroke();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3.5; ctx.beginPath();
    ctx.moveTo(x - 10, y); ctx.lineTo(x + 10, y); ctx.moveTo(x, y - 10); ctx.lineTo(x, y + 10); ctx.stroke();
  }

  let b3Raf = null, b3T0 = 0;
  function b3Iniciar() {
    b3Parar();
    b3T0 = performance.now();
    const loop = now => { b3Desenhar(now - b3T0); b3Raf = requestAnimationFrame(loop); };
    b3Raf = requestAnimationFrame(loop);
  }
  function b3Parar() {
    if (b3Raf) cancelAnimationFrame(b3Raf);
    b3Raf = null;
  }
  b3Desenhar(0);

  // ---------- Bloco 3 · Etapa 1: valor da função e interceptos ----------
  const eG = [
    { f: x => x * x, dom: [-2, 2], pontos: null, especiais: [0] },
    { f: x => -0.25 * (x + 6) * (x - 2), dom: [-4, 4], pontos: [[-4, 3], [-2, 4], [0, 3], [2, 0], [4, -5]], especiais: [-2, 0, 2] }
  ];
  const E_W = 360, E_H = 360, E_ESC = 36;   // janela de −5 a 5 nos dois eixos, mesma escala
  const eX = x => (x + 5) * E_ESC;
  const eY = y => E_H - (y + 5) * E_ESC;
  const eInvX = px => px / E_ESC - 5;
  const eInvY = py => (E_H - py) / E_ESC - 5;
  const ePonto = (ctx, x, y, r, col) => dot(ctx, x, y, r, col);

  // estilos desta etapa
  const eCss = document.createElement('style');
  eCss.textContent = `
    .b3-g[hidden] { display: none; }
    .b3-ajuda { position: absolute; top: 8px; right: 8px; width: 34px; height: 34px; border-radius: 50%; padding: 0; min-height: 0; background: var(--roxo); color: #fff; font-weight: 800; font-size: 1.1rem; z-index: 3; }
    .b3-perg { position: absolute; top: 8px; right: 50px; height: 124px; width: 0; overflow: hidden; background: #fffdf5; border: 0; border-radius: 12px; transition: width .45s ease; z-index: 3; }
    .b3-perg.aberto { width: 210px; border: 1.5px solid var(--roxo); }
    .b3-perg button { display: block; margin: 8px 6px; width: calc(100% - 12px); min-height: 42px; padding: 0 8px; white-space: nowrap; }
    .b3-bloq { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 16px; background: rgba(255, 253, 245, .78); color: var(--tinta); font-weight: 700; cursor: pointer; border-radius: 14px; z-index: 2; }
    .b3-bloq.oculto { display: none; }
    .b3-resp { margin-top: 12px; transition: opacity .3s; }
    .b3-resp.travado { opacity: .35; pointer-events: none; }
